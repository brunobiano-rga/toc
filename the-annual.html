<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The One Club — Archive · Discover (v52)</title>
<style>
/* typeface: Circular Std (Book 400 · Medium 500 · Bold 700 · Black 900), from the system install; Helvetica fallback */
@font-face{font-family:"TOC Circular";font-style:normal;font-weight:400;font-display:swap;src:local("Circular Std Book"),local("CircularStd-Book"),local("Circular Std"),local("CircularStd"),local("Circular Book"),local("CircularXX-Book"),local("Circular")}
@font-face{font-family:"TOC Circular";font-style:italic;font-weight:400;font-display:swap;src:local("Circular Std Book Italic"),local("CircularStd-Book Italic"),local("CircularStd-BookItalic")}
@font-face{font-family:"TOC Circular";font-style:normal;font-weight:500;font-display:swap;src:local("Circular Std Medium"),local("CircularStd-Medium"),local("Circular Medium"),local("CircularXX-Medium")}
@font-face{font-family:"TOC Circular";font-style:italic;font-weight:500;font-display:swap;src:local("Circular Std Medium Italic"),local("CircularStd-Medium Italic"),local("CircularStd-MediumItalic")}
@font-face{font-family:"TOC Circular";font-style:normal;font-weight:700;font-display:swap;src:local("Circular Std Bold"),local("CircularStd-Bold"),local("Circular Bold"),local("CircularXX-Bold")}
@font-face{font-family:"TOC Circular";font-style:italic;font-weight:700;font-display:swap;src:local("Circular Std Bold Italic"),local("CircularStd-Bold Italic"),local("CircularStd-BoldItalic")}
@font-face{font-family:"TOC Circular";font-style:normal;font-weight:900;font-display:swap;src:local("Circular Std Black"),local("CircularStd-Black"),local("Circular Black"),local("CircularXX-Black")}
@font-face{font-family:"TOC Circular";font-style:italic;font-weight:900;font-display:swap;src:local("Circular Std Black Italic"),local("CircularStd-Black Italic"),local("CircularStd-BlackItalic")}
@font-face{font-family:"TOC Circular Mono";font-weight:400;font-display:swap;src:local("Circular Mono"),local("CircularMono-Book"),local("Circular Std Mono"),local("CircularXX Mono"),local("CircularXXMono-Book")}
:root{--ff:"TOC Circular","Circular Std","CircularStd","Circular","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ffm:"TOC Circular Mono","TOC Circular","Circular Std","Helvetica Neue",Arial,sans-serif}
:root{--bg:#f2f0eb;--ink:#151515;--mute:#86827a;--faint:#b9b4aa;--line:rgba(0,0,0,.08);--accent:#e2231a;--gold:#b8901c;
  --glass:rgba(250,249,246,.72);--pill:#e6e3dd;--pillh:#dad6ce;--tile:#e3dfd6;--onink:#fff;--hdr:rgba(242,240,235,0);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ff);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:inherit}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);box-shadow:0 10px 40px -18px rgba(0,0,0,.25)}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;height:72px;z-index:60;pointer-events:none;background:linear-gradient(var(--bg) 40%,var(--hdr))}
.logo{position:relative;height:38px;pointer-events:auto;display:block}
.logo img{height:38px;width:auto;display:block}
.logo .lg-w{display:none}
body.timeline .logo .lg-w{display:block}
body.timeline .logo .lg-b{display:none}
.logo .alt{font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1.05;display:none}
.tabs{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:30px;pointer-events:auto}
.tabs button{background:none;border:0;padding:8px 18px;font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--mute);cursor:pointer;border-radius:22px;transition:background .25s,color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--onink)}
.tabs small{font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-left:6px}
.crumb{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:55;display:none;align-items:center;gap:6px;white-space:nowrap}
.crumb.on{display:flex}
.crumb button,.crumb .now{border:0;cursor:pointer;background:var(--pill);color:var(--ink);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 15px;border-radius:30px;line-height:1.2;transition:background .2s}
.crumb .sep{display:none}
.crumb .now{cursor:default;background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.crumb button:hover{background:var(--pillh)}
.crumb b{color:var(--ink);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10.5px}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;cursor:grab;touch-action:none;overflow:hidden}
#stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transition:opacity .4s,filter .8s var(--ease)}
#world.fade{opacity:0}
body.intro #world{filter:blur(9px) saturate(.8);opacity:.55}

.ent{position:absolute;left:0;top:0;will-change:transform;transform-origin:50% 50%}
.tile{padding:0;border:0;background:var(--tile);cursor:pointer;border-radius:12px;overflow:hidden;outline:none;transition:opacity .45s,box-shadow .4s}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.tile .ph{position:absolute;inset:0}
.tile:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.tile.dim{opacity:.12}
.tile.focused{z-index:6;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.tile .sv{position:absolute;right:7px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0;transition:opacity .3s}
.tile.saved .sv{opacity:1}
.tile.focused .sv{opacity:0}

/* ---------- focus info ---------- */
#info{position:absolute;left:0;top:0;z-index:7;pointer-events:none}
.ib{position:absolute;opacity:0;transition:opacity .35s;pointer-events:none}
#info.on .ib,.tl-fw.on .ib{opacity:1;pointer-events:auto;transition-delay:.25s}
.lbl{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.sub{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-top:7px;line-height:1.35}
.hv{font-family:var(--ff);font-weight:700;letter-spacing:-.015em;line-height:1.15}
.pill{font-size:8px;letter-spacing:.14em;border:1px solid var(--ink);padding:4px 8px;border-radius:20px}
/* top: award icon, award · year, category, pencils */
.fi-top{transform:translate(-50%,-100%);text-align:center;width:420px}
.fi-top .ico{display:flex;justify-content:center;margin-bottom:14px;min-height:34px;align-items:center}
.fi-top .ico img{height:52px;width:auto;display:block}
.fi-top .hv{font-size:19px}
/* sides: agency (left) and client (right) */
.fi-side{transform:translate(-50%,-50%);text-align:center;width:180px}
.fi-side .hv{font-size:17px}
/* bottom: credits in the centre, Save / See more pills in the corners */
.fi-credits{transform:translate(-50%,0);text-align:center;width:240px}
.fi-credits.up{transform:translate(-50%,-100%)}
.fi-credits.up .list{position:absolute;left:0;right:0;top:100%;z-index:5}
.fi-top.down{transform:translate(-50%,0)}
.fi-top.down .ico{margin-bottom:10px}
.fi-top.down .ico img{height:40px}
.fi-credits .cbtn{background:none;border:0;cursor:pointer;padding:6px 14px;border-radius:14px;width:100%}
.fi-credits .cbtn:hover{background:rgba(0,0,0,.04)}
.fi-credits .hv{font-size:19px}
.fi-credits .list{display:none;margin-top:8px;text-align:left;max-height:210px;overflow:auto;padding:12px 16px;border-radius:14px}
.fi-credits.open .list{display:block}
.fi-credits dl{margin:0}
.fi-credits dt{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.fi-credits dt:first-child{margin-top:0}
.fi-credits dd{margin:2px 0 0;font-size:11.5px;line-height:1.35}
.fi-credits .full{display:block;margin-top:10px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;font-weight:700}
.fi-btn{transform:translate(0,-50%)}
.fi-btn.r{transform:translate(-100%,-50%)}
.pbtn{display:inline-block;background:var(--pill);border:0;border-radius:22px;padding:10px 16px;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .2s}
.pbtn:hover{background:var(--pillh)}
.pbtn.on{background:var(--ink);color:var(--onink)}
body.credits-open #search,body.credits-open #filters{opacity:0;pointer-events:none;transition:opacity .3s}

/* ---------- clusters ---------- */
.cluster{width:260px;cursor:pointer;text-align:center;outline:none}
.cluster .ct{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;transition:transform .3s var(--ease)}
.cluster .ct sup{font-size:9px;color:var(--mute);font-weight:400;letter-spacing:.04em;margin-left:4px}
.cluster .cs{font-size:10px;color:var(--mute);margin-top:4px}
.cluster .cs b{font-weight:400;color:var(--ink);opacity:0;transition:opacity .25s}
.cluster:hover .cs b,.cluster:focus-visible .cs b{opacity:1}
.cluster .minis{position:relative;height:210px;margin-top:14px}
.mini{position:absolute;left:50%;top:0;object-fit:cover;border-radius:7px;background:#e3dfd6;transition:opacity .3s}
.mini.dim{opacity:.15}

/* ---------- search ---------- */
#search{position:fixed;left:50%;z-index:70;width:min(600px,calc(100vw - 40px));transform:translate(-50%,-50%);top:50%;
  transition:top .8s var(--ease),width .8s var(--ease),transform .8s var(--ease)}
body:not(.intro) #search{top:calc(100% - 92px);width:min(460px,calc(100vw - 40px));transform:translate(-50%,-100%)}
.intro-copy{text-align:center;font-size:12px;color:var(--mute);margin-bottom:16px;line-height:1.5;transition:opacity .4s}
.intro-copy b{display:block;color:var(--ink);font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
body:not(.intro) .intro-copy{opacity:0;pointer-events:none;position:absolute;bottom:100%;left:0;right:0}
.sbar{display:flex;align-items:center;gap:10px;height:52px;border-radius:30px;padding:0 8px 0 20px;transition:height .6s var(--ease)}
body:not(.intro) .sbar{height:44px}
.sbar svg{flex:none;opacity:.55}
.sbar input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
body:not(.intro) .sbar input{font-size:13.5px}
.sbar input::placeholder{color:var(--mute)}
.sbar .enter{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--onink);cursor:pointer;display:grid;place-items:center;font-size:14px}
body:not(.intro) .sbar .enter{width:30px;height:30px}
.skip{display:block;margin:14px auto 0;background:none;border:0;color:var(--mute);font-size:11px;cursor:pointer;letter-spacing:.04em;transition:opacity .4s}
.skip:hover{color:var(--ink)}
body:not(.intro) .skip{opacity:0;pointer-events:none;position:absolute}
.sugg{position:absolute;left:0;right:0;border-radius:22px;padding:16px 18px;max-height:min(440px,60vh);overflow:auto;display:none}
#search.open .sugg{display:block}
body.intro .sugg{top:calc(100% + 10px)}
body:not(.intro) .sugg{bottom:calc(100% + 10px)}
.sg-sec+.sg-sec{margin-top:16px}
.sg-sec>.lbl{color:var(--mute);font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--pill);border-radius:20px;padding:6px 11px;font-size:12px;cursor:pointer}
.chip:hover,.chip.kb{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.rowr{display:flex;align-items:center;gap:12px;padding:6px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;width:calc(100% + 16px);background:none;border:0;text-align:left}
.rowr:hover,.rowr.kb{background:rgba(0,0,0,.05)}
.rowr img{width:52px;height:30px;object-fit:cover;border-radius:6px;background:#e3dfd6;flex:none}
.rowr .t{font-size:12.5px}
.rowr .m{font-size:10.5px;color:var(--mute);margin-top:2px}
.rowr .ico{width:22px;text-align:center;color:var(--mute);flex:none;font-size:12px}
.sg-foot{margin-top:12px;font-size:10.5px;color:var(--mute)}
mark{background:none;color:var(--ink);font-weight:700}

/* ---------- filter bar (bottom centre) ---------- */
#filters{position:fixed;left:50%;bottom:22px;transform:translate(-50%,0);z-index:65;display:flex;align-items:center;gap:4px;padding:5px;border-radius:30px;
  transition:transform .8s var(--ease),opacity .6s;white-space:nowrap}
body.intro #filters{transform:translate(-50%,140%);opacity:0}
.seg{display:flex;gap:2px;padding:0 4px}
.seg+.seg,.fbtn{border-left:1px solid var(--line)}
.fb{background:none;border:0;cursor:pointer;font-size:12px;padding:7px 11px;border-radius:20px;color:var(--mute);transition:background .25s,color .25s}
.fb:hover{color:var(--ink)}
.fb[aria-pressed=true]{background:var(--ink);color:var(--onink)}
.fbtn{padding-left:4px}
.chev{display:inline-block;font-size:11px;margin-left:3px;transform:translateY(-2px);transition:transform .3s}
.fb[aria-expanded=true] .chev{transform:translateY(1px) rotate(180deg)}
.qchip{display:none;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:20px;padding:6px 8px 6px 12px;font-size:12px;margin-left:4px}
.qchip.on{display:inline-flex}
.qchip button{border:0;background:rgba(255,255,255,.25);color:#fff;border-radius:50%;width:18px;height:18px;cursor:pointer;font-size:11px;line-height:1;padding:0}
.menu{position:fixed;left:50%;bottom:150px;transform:translate(-50%,10px);z-index:66;border-radius:22px;padding:18px 24px;opacity:0;pointer-events:none;transition:.35s var(--ease);
  max-height:min(560px,70vh);overflow:auto;min-width:420px}
.menu.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.menu .lbl{color:var(--mute);font-weight:700}
.big{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0;cursor:pointer;text-align:left;
  font-size:30px;letter-spacing:-.02em;line-height:1.1;color:var(--faint);transition:color .2s}
.big:hover{color:var(--ink)}
.big[aria-pressed=true]{color:var(--ink)}
.big sup{font-size:11px;letter-spacing:.02em;color:var(--mute)}

/* ---------- profile, count, zoom ---------- */
.profile{position:fixed;right:22px;top:16px;z-index:65;display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:30px;font-size:12px}
.profile .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--onink);display:grid;place-items:center;font-size:11px;letter-spacing:.04em}
.profile .nm{line-height:1.2;text-align:left}
.profile .tier{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.corner{position:fixed;right:22px;bottom:22px;z-index:65;display:flex;align-items:center;gap:6px}
.corner span{font-size:10.5px;color:var(--mute);margin-right:6px}
.corner button{width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;padding:0}
.greet{position:fixed;left:50%;top:72px;transform:translateX(-50%);font-size:12px;color:var(--mute);z-index:55;display:none;white-space:nowrap}
.greet.on{display:block}
.toast{position:fixed;right:22px;top:72px;transform:translate(0,-8px);background:var(--ink);color:var(--onink);font-size:11px;letter-spacing:.04em;padding:9px 14px;border-radius:30px;opacity:0;transition:.35s;z-index:90;pointer-events:none}
.toast.on{opacity:1;transform:translate(0,0)}

/* ---------- video previews (15 s) ---------- */
.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s;pointer-events:none;background:transparent}
.pv.on{opacity:1}
.fi-prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.fi-prog i{display:block;height:100%;width:0;background:var(--ink)}
.fi-snd{transform:translate(-100%,0)}
.sbtn{white-space:nowrap;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:20px;padding:6px 11px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.pv-badge{position:absolute;left:8px;bottom:7px;font-size:9px;letter-spacing:.06em;color:#fff;background:rgba(0,0,0,.45);padding:3px 6px;border-radius:10px;opacity:0;transition:opacity .3s;pointer-events:none}
.tile:hover .pv-badge{opacity:1}
.tile.focused .pv-badge{display:none}

/* ---------- experience view toggle ---------- */
.viewtog{position:fixed;left:22px;bottom:22px;z-index:66;display:flex;gap:2px;padding:4px;border-radius:30px}
.viewtog .lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:0 6px 0 10px;align-self:center}
.viewtog button{background:none;border:0;padding:7px 13px;font-size:10.5px;letter-spacing:.12em;font-weight:600;color:var(--mute);cursor:pointer;border-radius:22px}
.viewtog button[aria-pressed=true]{background:var(--ink);color:var(--onink)}

/* ---------- TIMELINE (dark) ---------- */
body.timeline{--bg:#121212;--ink:#efede8;--mute:#8e8a83;--faint:#5f5c57;--line:rgba(255,255,255,.12);--glass:rgba(30,30,30,.72);
  --pill:#2a2a2a;--pillh:#363636;--tile:#202020;--onink:#121212;--hdr:rgba(18,18,18,0)}
body{transition:background .6s var(--ease),color .6s}
body.timeline #stage,body.timeline .greet{opacity:0;pointer-events:none}
body.timeline .corner{display:none}
#stage,#search,#filters,.corner{transition:opacity .5s}
#tl{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .6s;user-select:none;-webkit-user-select:none}
body.timeline #tl{opacity:1;pointer-events:auto}

.tl-strip{position:absolute;left:0;right:0;top:78px;height:176px;overflow:hidden;cursor:grab}
.tl-strip.drag,.tl-bottom.drag{cursor:grabbing}
.tl-col{position:absolute;left:0;top:0;width:150px;will-change:transform}
.tl-col .im{position:relative;width:150px;overflow:hidden;background:var(--tile)}
.tl-col img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) brightness(.86);transition:filter .3s}
.tl-col:hover img,.tl-col.cur img{filter:none}
.tl-col .cap{display:flex;justify-content:space-between;gap:6px;padding:7px 7px 0;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;line-height:1.3;color:var(--ink);opacity:.75}
.tl-col .cap span:last-child{flex:none}
.tl-col.cur .cap{opacity:1}
.tl-col.dim{opacity:.18}
.tl-feat{position:absolute;left:0;right:0;top:256px;bottom:145px}
.tl-fw{position:absolute;left:50%;top:0;transition:opacity .45s}
.tl-fw.out{opacity:0}
.tl-frame{position:absolute;border-radius:12px;overflow:hidden;background:var(--tile);transform:translate(-50%,-50%);cursor:pointer}
.tl-frame img{width:100%;height:100%;object-fit:cover;display:block}
.tl-bottom{position:absolute;left:0;right:0;bottom:0;height:140px;cursor:grab;background:linear-gradient(transparent,var(--bg) 30%)}
.tl-fi{position:absolute;left:0;bottom:0;width:18px;height:132px;will-change:transform}
.tl-fi .th{position:absolute;left:1px;right:1px;bottom:78px;height:24px;overflow:hidden;background:var(--tile);transition:all .3s var(--ease)}
.tl-fi .th img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.6) brightness(.7)}
.tl-fi.cur .th{left:-8px;right:-8px;height:44px;bottom:84px;z-index:2;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.tl-fi.cur .th img{filter:none}
.tl-fi.dim .th{opacity:.25}
.tl-fi .tk{position:absolute;left:8px;bottom:14px;width:1px;height:12px;background:var(--faint)}
.tl-fi.major .tk{height:22px;background:var(--mute)}
.tl-fi .lab{position:absolute;left:3px;bottom:44px;font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-fi .lab.yr{color:var(--ink);font-weight:700;font-size:11px;bottom:58px}
.tl-play{position:absolute;left:50%;bottom:10px;width:1px;height:104px;background:var(--ink);opacity:.8;pointer-events:none}
.tl-ctrl{position:absolute;left:22px;bottom:150px;display:flex;gap:8px;align-items:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tl-ctrl button{background:var(--pill);color:var(--ink);border:0;border-radius:20px;padding:7px 12px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.tl-count{position:absolute;right:22px;bottom:150px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}


/* ---------- CIRCULAR TIMELINE (dark) ---------- */
#orb{position:absolute;inset:0;overflow:hidden}
.orb-guide{position:absolute;inset:0;pointer-events:none}
.orb-guide path,.orb-guide circle{fill:none;stroke:var(--line);stroke-width:1}
.cnode{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;cursor:pointer;transition:transform .9s var(--ease),opacity .5s}
.cnode .ci{width:100%;height:100%;border-radius:10px;overflow:hidden;background:var(--tile);transition:transform .35s var(--ease),box-shadow .35s}
.cnode .ci img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.5) brightness(.75);transition:filter .35s}
.cnode:hover .ci,.cnode:focus-visible .ci{transform:scale(1.35);box-shadow:0 10px 30px rgba(0,0,0,.6)}
.cnode:hover .ci img,.cnode:focus-visible .ci img{filter:none}
.cnode .cl{position:absolute;left:50%;top:50%;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);transform-origin:0 50%;pointer-events:none;transition:color .3s}
.cnode .cl b{font-weight:400;color:var(--faint);margin-left:6px}
.cnode:hover .cl{color:var(--ink)}
.cnode.gone{opacity:0;pointer-events:none}
.orb-center{position:absolute;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:min(560px,60vw);transition:opacity .4s}
.orb-center .hv{font-size:30px;letter-spacing:-.02em}
.orb-center .c1{font-size:26px;color:var(--mute);line-height:1.2}
.orb-center .c2{font-size:28px;color:var(--ink);line-height:1.2;margin-top:2px}
.orb-center .c3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:12px}
#orbTxt{transition:opacity .2s}
.orb-center .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.orb-center .cur{margin-top:16px;font-size:13px;color:var(--ink);min-height:18px}
.orb-center .cur small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.orb-center button{pointer-events:auto;margin-top:18px;background:var(--pill);color:var(--ink);border:0;border-radius:20px;padding:8px 14px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.orb-center button:hover{background:var(--pillh)}
.athumb{position:absolute;left:0;top:0;transform-origin:50% 50%;border-radius:12px;overflow:hidden;background:var(--tile);cursor:pointer;will-change:transform,opacity;box-shadow:0 14px 40px -18px rgba(0,0,0,.8)}
.athumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.athumb .yr{position:absolute;left:8px;bottom:6px;font-size:9px;letter-spacing:.08em;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:8px;opacity:0;transition:opacity .3s}
.athumb:hover .yr{opacity:1}
.athumb.sel .yr{display:none}
.atick{display:none}
.atick.major{display:block;position:absolute;left:0;top:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);pointer-events:none}
.alab{position:absolute;left:0;top:0;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink);pointer-events:none;transform:translate(-50%,-50%)}
#orb.solo .atick,#orb.solo .alab,#orb.solo .orb-center{opacity:0!important;pointer-events:none}
.atick,.alab,.orb-center{transition:opacity .4s}
.athumb.sel{z-index:200!important;box-shadow:0 30px 70px -30px rgba(0,0,0,.9)}
.solo-x{position:absolute;right:24px;top:84px;background:var(--pill);color:var(--ink);border:0;border-radius:20px;padding:8px 14px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
#orb.solo .solo-x{opacity:1;pointer-events:auto}
.solo-nav{position:fixed;bottom:22px;top:auto;z-index:70;width:44px;height:44px;border-radius:50%;border:0;background:var(--pill);color:var(--ink);font-size:16px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s}
#orb.solo .solo-nav{opacity:1;pointer-events:auto}
.solo-nav.p{right:74px;left:auto}.solo-nav.n{right:22px}


/* ---------- modular One Club menu (brand container) ---------- */
.brand{--mbg:#ffffff;--mink:#151515;--mmute:#8b877f;--mline:rgba(0,0,0,.08);--mcard:#efece6;
  position:fixed;left:22px;top:16px;z-index:85;background:var(--mbg);color:var(--mink);border-radius:28px;overflow:hidden;
  box-shadow:0 10px 40px -18px rgba(0,0,0,.35);border:1px solid var(--mline);
  width:var(--bw,140px);height:var(--bh,56px);transition:width .55s var(--ease),height .55s var(--ease),border-radius .55s var(--ease)}
body.timeline .brand{--mbg:#0b0b0b;--mink:#efede8;--mmute:#8e8a83;--mline:rgba(255,255,255,.12);--mcard:#1b1b1b}
body.timeline .brand .lg-w{display:block}body.timeline .brand .lg-b{display:none}
.brand.open{border-radius:20px}
.brand-bar{position:relative;display:flex;align-items:center;gap:14px;height:54px;padding:0 10px 0 16px;white-space:nowrap}
.brand.open .menu-ico{position:absolute;right:12px;top:10px}
#menuShade{position:fixed;inset:0;z-index:84;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#menuShade.on{opacity:1}
.menu-ico{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:background .2s}
.menu-ico:hover,.brand.open .menu-ico{background:var(--mcard)}
.menu-ico span{display:block;width:15px;height:1.5px;background:var(--mink);transition:transform .35s var(--ease)}
.brand.open .menu-ico span:first-child{transform:translateY(3.25px) rotate(45deg)}
.brand.open .menu-ico span:last-child{transform:translateY(-3.25px) rotate(-45deg)}
.brand-body{position:absolute;left:0;top:54px;width:var(--bw-open,900px);padding:10px 22px 22px;opacity:0;transition:opacity .25s}
.brand.open .brand-body{opacity:1;transition-delay:.12s}
.mm{display:grid;grid-template-columns:300px 1fr;gap:26px}
.mm-list{border-top:1px solid var(--mline)}
.mm-item{display:flex;justify-content:space-between;align-items:baseline;width:100%;background:none;border:0;border-bottom:1px solid var(--mline);padding:9px 0;cursor:pointer;color:var(--mmute);text-align:left;text-decoration:none}
.mm-item b{font-weight:400;font-size:27px;letter-spacing:-.02em;line-height:1.1;transition:color .2s}
.mm-item small{font-size:9.5px;letter-spacing:.04em;color:var(--mmute);text-align:right;max-width:120px;line-height:1.3}
.mm-item:hover b,.mm-item.on b,.mm-item:focus-visible b{color:var(--mink)}
.mm-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:22px;font-size:10.5px}
.mm-foot a{color:var(--mmute);text-decoration:none}.mm-foot a:hover{color:var(--mink)}
.mm-foot .h{color:var(--mink);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.mm-stage{position:relative;min-height:10px}
.mm-pane{animation:mmIn .45s var(--ease)}
@keyframes mmIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mm-grid{display:grid;gap:10px}
.mm-card{position:relative;display:block;border-radius:12px;overflow:hidden;background:var(--mcard);color:#fff;text-decoration:none;min-height:120px}
.mm-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.mm-card:hover img{transform:scale(1.04)}
.mm-card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.6))}
.mm-card .cap{position:absolute;left:12px;right:12px;bottom:10px;z-index:1;font-size:12px;line-height:1.3}
.mm-card .cap b{display:block;font-weight:500;font-size:13px}
.mm-card .cap span{opacity:.75}
.mm-card.txt{color:var(--mink);padding:14px 16px}
.mm-card.txt::after{display:none}
.mm-card.txt b{display:block;font-weight:500;font-size:17px;letter-spacing:-.01em}
.mm-card.txt p{margin:6px 0 0;font-size:11.5px;color:var(--mmute);line-height:1.4}
.mm-card.txt .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mmute);margin-top:12px}
.mm-desc{font-size:21px;letter-spacing:-.01em;line-height:1.2;color:var(--mink)}
.mm-desc span{color:var(--mmute)}
.mm-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.mm-pill{display:inline-flex;gap:8px;align-items:center;background:var(--mcard);color:var(--mink);border-radius:20px;padding:7px 12px;font-size:11.5px;text-decoration:none;transition:filter .2s}
.mm-pill:hover{filter:brightness(.93)}
.mm-card.txt .mm-pill{background:var(--mbg)}
body.timeline .mm-pill:hover{filter:brightness(1.3)}


/* ---------- TRENDING USERS (spatial · explore) ---------- */
:root{--trh:224px;--panel:rgba(246,244,240,.97)}
body.timeline{--panel:rgba(24,24,24,.97)}
#trend{position:fixed;left:0;right:0;top:72px;height:var(--trh);z-index:61;transition:transform .55s var(--ease),opacity .45s var(--ease)}
body:not(.tr-open) #trend,body.intro #trend,body.timeline #trend,body.no-tr #trend{transform:translateY(-26px);opacity:0;pointer-events:none}
.tr-track{display:flex;gap:10px;overflow-x:auto;overflow-y:visible;padding:12px 22px 16px;scroll-behavior:smooth;scrollbar-width:none}
.tr-track::-webkit-scrollbar{display:none}
.tu{flex:0 0 auto;width:360px;height:196px;border-radius:22px;padding:18px 16px 16px 18px;display:flex;gap:14px;cursor:pointer;text-align:left;position:relative;transition:transform .35s var(--ease),box-shadow .35s,background .25s}
.tu.glass{background:rgba(246,244,240,.8);-webkit-backdrop-filter:blur(40px) saturate(1.6);backdrop-filter:blur(40px) saturate(1.6);border:1px solid rgba(255,255,255,.6)}
body.timeline .tu.glass{background:rgba(28,28,28,.8);border-color:rgba(255,255,255,.08)}
.tu:hover{transform:translateY(-3px)}
.tu[aria-pressed=true]{box-shadow:0 0 0 1.5px var(--ink),0 10px 40px -18px rgba(0,0,0,.3)}
.tu .l{flex:1;min-width:0;display:flex;flex-direction:column}
.tu .who{display:flex;align-items:center;gap:10px}
.tu .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;flex:0 0 auto;letter-spacing:.03em}
.tu .nm{font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tu .rl{font-size:11px;color:var(--mute);letter-spacing:.01em;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tu .bd{margin-top:auto;font-size:21px;line-height:1.1;letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tu .mt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.tu .tg{display:inline-block;font-style:normal;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid currentColor;border-radius:20px;padding:2px 7px;margin-top:5px}
.tu .fan{position:relative;width:118px;flex:0 0 auto}
.tu .fan img{position:absolute;width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--tile);box-shadow:0 10px 22px -10px rgba(0,0,0,.45);transition:transform .45s var(--ease)}
.tu .fan img:nth-child(1){left:22px;top:0;transform:rotate(6deg)}
.tu .fan img:nth-child(2){left:11px;top:40px;transform:rotate(-3deg)}
.tu .fan img:nth-child(3){left:0;top:84px;transform:rotate(-8deg)}
.tu:hover .fan img:nth-child(1){transform:translate(6px,-4px) rotate(10deg)}
.tu:hover .fan img:nth-child(3){transform:translate(-4px,4px) rotate(-12deg)}
.tu .rk{position:absolute;right:16px;bottom:14px;font-size:10px;color:var(--mute);letter-spacing:.06em}
/* header toggle (collapse / expand the carousel) */
.tabs .tsep{width:1px;background:var(--line);margin:6px 4px}
.trtog{display:flex!important;align-items:center;gap:7px;padding:5px 12px 5px 6px!important}
.trtog .stk{display:flex}
.trtog .stk i{width:20px;height:20px;border-radius:50%;margin-left:-7px;border:2px solid var(--bg);display:block}
.trtog .stk i:first-child{margin-left:0}
.trtog .cv{display:inline-block;transition:transform .4s var(--ease);font-size:10px}
body.tr-open .trtog .cv{transform:rotate(180deg)}
body.tr-open .trtog{color:var(--ink)!important}
body.timeline .trtog{display:none!important}
.crumb{transition:top .55s var(--ease)}
body.tr-open:not(.timeline):not(.no-tr) .crumb{top:calc(80px + var(--trh))}
#stage{-webkit-mask-image:linear-gradient(transparent 0,#000 var(--stm,0px));mask-image:linear-gradient(transparent 0,#000 var(--stm,0px))}

/* trending mode: 60% black over the spatial grid; click it to fold the carousel back */
#trShade{position:fixed;inset:0;z-index:59;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
body.tr-on #trShade{opacity:1;pointer-events:auto;cursor:pointer}
header{transition:background .4s}
body.tr-on header{background:transparent}
/* ---------- PROFILE PANEL (ex "For you") ---------- */
.profile{cursor:pointer;border:1px solid var(--line);transition:background .25s,box-shadow .3s}
.profile:hover{box-shadow:0 0 0 1px var(--ink),0 10px 40px -18px rgba(0,0,0,.25)}
.profile .cv{font-size:10px;color:var(--mute);margin-left:2px;transition:transform .35s var(--ease)}
body.me-open .profile .cv{transform:rotate(180deg)}
body.me-open .profile{z-index:96}
#me{position:fixed;right:22px;top:66px;width:452px;max-height:calc(100vh - 88px);z-index:95;border-radius:24px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;
  transform-origin:100% 0;transform:translateY(-8px) scale(.96);opacity:0;pointer-events:none;transition:transform .45s var(--ease),opacity .3s}
body.me-open #me{transform:none;opacity:1;pointer-events:auto}
.me-b{overflow-y:auto;padding:20px 22px 22px;scrollbar-width:thin}
.me-greet{font-size:22px;line-height:1.15;letter-spacing:-.015em;margin:0 0 4px}
.me-greet span{color:var(--mute)}
.me-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin:16px 0 12px}
.me-stats div{background:var(--panel);padding:10px 12px}
.me-stats b{display:block;font-size:20px;font-weight:400;letter-spacing:-.02em}
.me-stats span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.me-feat{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;line-height:1.3}
.me-feat .gt{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.me-feat .sw{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--pill);position:relative;border:0;cursor:pointer;flex:0 0 auto;transition:background .25s}
.me-feat .sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bg);transition:transform .3s var(--ease)}
.me-feat .sw[aria-pressed=true]{background:var(--ink)}
.me-feat .sw[aria-pressed=true]::after{transform:translateX(14px)}
.me-sec{margin-top:20px}
.me-st{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.me-st b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-st sup{font-size:10px;color:var(--mute)}
.me-st button{margin-left:auto;flex:0 0 auto;border:0;background:var(--pill);border-radius:20px;padding:5px 11px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.me-st button:hover{background:var(--pillh)}
.me-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.me-row::-webkit-scrollbar{display:none}
.me-row button{flex:0 0 auto;width:92px;height:68px;border:0;padding:0;border-radius:9px;overflow:hidden;background:var(--tile);cursor:pointer;transition:transform .3s var(--ease)}
.me-row button:hover{transform:translateY(-2px)}
.me-row img{width:100%;height:100%;object-fit:cover;display:block}
.me-empty{font-size:11.5px;color:var(--mute);padding:14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
.me-q{display:flex;flex-wrap:wrap;gap:6px}
.me-q button{border:0;background:var(--pill);border-radius:20px;padding:6px 12px;font-size:11px;cursor:pointer}
.me-q button:hover{background:var(--pillh)}
.me-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}


/* ---------- CREDITS MODE · stacked cards (ref. kunuminst.org/content) ---------- */
#crx{position:fixed;inset:0;z-index:80;opacity:0;pointer-events:none;transition:opacity .5s var(--ease)}
#crx::before{content:"";position:absolute;inset:0;background:rgba(242,240,235,.5);-webkit-backdrop-filter:blur(28px) saturate(1.2);backdrop-filter:blur(28px) saturate(1.2)}
body.timeline #crx::before{background:rgba(14,14,14,.55)}
body.crx-on #crx{opacity:1;pointer-events:auto}
body.crx-on #stage,body.crx-on #tl{transform:translateY(-34vh);transition:transform .8s var(--ease),opacity .5s}
#stage,#tl{transition:transform .8s var(--ease),opacity .6s}
body.crx-on .tabs,body.crx-on #search,body.crx-on #filters,body.crx-on .viewtog,body.crx-on .corner,body.crx-on .crumb,body.crx-on #soloP,body.crx-on #soloN{opacity:0!important;pointer-events:none!important}
.tabs,.viewtog{transition:opacity .4s}
.cx-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.cx-scroll::-webkit-scrollbar{display:none}
.cx-col{width:min(500px,calc(100vw - 32px));margin:0 auto;padding:30vh 0 40vh;display:flex;flex-direction:column}
/* top bar — like the reference's tag search pill */
.cx-bar{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 6px;border-radius:14px;
  background:rgba(26,26,26,.38);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);max-width:calc(100vw - 420px)}
.cx-bar .chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cx-bar .chips::-webkit-scrollbar{display:none}
.cx-chip,.cx-tag{font-family:var(--ffm);font-size:9.5px;letter-spacing:.02em;padding:5px 7px;border-radius:7px;border:0;background:rgba(255,255,255,.18);color:#fafafa;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s}
.cx-chip:hover{background:rgba(255,255,255,.32)}
.cx-chip[aria-current=true]{background:#fff;color:#000}
.cx-chip sup{opacity:.55;margin-left:3px;font-size:8px}
.cx-x{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fafafa;cursor:pointer;font-size:14px;line-height:1;margin-left:4px}
.cx-x:hover{background:rgba(255,255,255,.34)}
/* modules: each credit area is a section; its cards stick and stack, the next module pushes the stack up */
.cx-mod{position:relative;padding-bottom:11vh}
.cx-mod:last-child{padding-bottom:0}
.cx-lbl{position:sticky;top:72px;z-index:2;align-self:flex-start;display:flex;align-items:center;gap:8px;margin:0 0 10px;height:28px;
  font-family:var(--ffm);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.cx-lbl span{background:var(--ink);color:var(--onink);padding:4px 8px;border-radius:7px}
.cx-lbl i{font-style:normal;color:var(--mute)}
.cx-card{position:sticky;margin-bottom:10px;transform-origin:50% 0;opacity:0;translate:0 30px;transition:opacity .6s var(--ease),translate .6s var(--ease)}
.cx-card.in{opacity:1;translate:0 0}
.cx-in{display:block;width:100%;text-align:left;border:0;color:#fafafa;text-decoration:none;border-radius:24px;overflow:clip;padding:22px;cursor:default;
  background:rgba(26,26,26,.376);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 20px 50px -30px rgba(0,0,0,.45);
  transform:scale(var(--sc,1));transform-origin:50% 0;transition:transform .35s var(--ease),background .35s}
a.cx-in,button.cx-in{cursor:pointer}
.cx-in:hover{background:rgba(26,26,26,.5)}
body.timeline .cx-in{background:rgba(255,255,255,.07)}
body.timeline .cx-in:hover{background:rgba(255,255,255,.12)}
body.timeline .cx-bar{background:rgba(255,255,255,.08)}
.cx-row{display:flex;gap:10px;opacity:calc(.65*var(--fo,1));transition:opacity .5s}
.cx-in:hover .cx-row{opacity:var(--fo,1)}
.cx-txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.cx-t{font-size:20px;line-height:1.1;letter-spacing:-.005em;text-wrap:pretty;margin:0;font-weight:400}

.intro-copy .ig{font-size:19px;font-weight:600;color:var(--mute);letter-spacing:-.005em;margin-bottom:8px;opacity:.85}
.intro-copy .ip{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-.01em;transition:opacity .45s var(--ease),transform .45s var(--ease)}
.intro-copy .ip.out{opacity:0;transform:translateY(6px)}
body.intro .sbar{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:center;padding:0 20px}
body.intro .sbar svg,body.intro .sbar .enter{display:none}
body.intro .sbar input{text-align:center;font-size:19px;font-weight:600}
body.intro .sbar input::placeholder{color:var(--mute);opacity:.8}
body.intro .sbar:focus-within{background:var(--glass);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
body.intro #trend{transform:none;opacity:1;pointer-events:auto;top:calc(50% - 330px)}
body.intro #trend .tr-track{justify-content:safe center}
/* entry icons (ref: soft squircles, white glyphs) */
.entry{position:fixed;left:50%;bottom:9vh;transform:translateX(-50%);z-index:70;display:flex;gap:44px;transition:opacity .5s var(--ease),transform .6s var(--ease)}
body:not(.intro) .entry{opacity:0;pointer-events:none;transform:translate(-50%,30px)}
.ent-b{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;cursor:pointer;padding:0;color:var(--ink)}
.ent-i{width:120px;height:120px;border-radius:38px;display:grid;place-items:center;background:rgba(40,30,20,.16);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);
  transition:transform .45s var(--ease),background .3s}
.ent-b:hover .ent-i{transform:translateY(-4px) scale(1.04);background:rgba(40,30,20,.24)}
.ent-l{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;opacity:.7}
.ent-i svg{filter:drop-shadow(0 2px 6px rgba(0,0,0,.18));transition:transform 1.2s var(--ease)}
.ent-b:hover .ent-i svg{transform:rotate(90deg)}
.ent-sp{position:relative}
.ent-sp i{position:absolute;left:50%;top:50%;border-radius:30%;transform:translate(-50%,-50%);background:#fff}
.ent-sp i:nth-child(1){width:64px;height:64px;opacity:.22;filter:blur(1px)}
.ent-sp i:nth-child(2){width:46px;height:46px;opacity:.45}
.ent-sp i:nth-child(3){width:28px;height:28px;opacity:1;box-shadow:0 0 18px rgba(255,255,255,.9)}
.ent-b:hover .ent-sp i:nth-child(1){width:72px;height:72px}
.ent-sp i{transition:width .5s var(--ease),height .5s var(--ease)}
.skip{display:none!important}
body.intro .viewtog,body.intro .corner{opacity:0;pointer-events:none}
.viewtog{transition:opacity .4s}
/* v31 · header: no gradient, one height (56px = logo pill) for logo, tabs and profile */
header{background:none!important}
.tabs{top:16px;height:56px;padding:8px;align-items:center;border-radius:30px}
.tabs button{height:40px;padding:0 20px;border-radius:22px}
.tabs .trtog{height:40px;padding:0 16px 0 10px!important}
.tabs .tsep{margin:10px 4px}
.profile{top:16px;height:56px;padding:8px 18px 8px 8px;border-radius:30px}
.profile .av{width:40px;height:40px;font-size:12px}
.crumb{top:84px}
body.tr-open:not(.timeline):not(.no-tr) .crumb{top:calc(90px + var(--trh))}
#trend{top:80px}
.toast{top:84px}
body.art-on .toast{top:84px}
#me,.ar-side,.ar-ppl{top:82px}
#me{max-height:calc(100vh - 104px)}
.ar-side,.ar-ppl{max-height:calc(100vh - 104px)}
.ar-rt{top:16px;height:56px}
.ar-top{top:16px;align-items:center}
.ar-sf,.ar-save{height:56px;border-radius:20px}
.ar-sf{padding:0 12px 0 18px}
.ar-sg{top:62px}
.cx-bar{top:16px;height:56px;border-radius:20px;padding:0 10px}
/* first access: no carousel; the conversation sits right above the two entry icons */
body.intro #trend{transform:translateY(-26px)!important;opacity:0!important;pointer-events:none!important}
body.intro #search{top:calc(100% - 9vh - 190px);transform:translate(-50%,-100%)}
body.intro .sugg{top:auto;bottom:calc(100% + 10px)}
/* v32 · Circular everywhere; former mono roles keep their size and get tabular figures */
html,body,button,input,select,textarea{font-family:var(--ff)}
.cx-chip,.cx-tag,.cx-m,.cx-lbl,.cx-th b,.ar-tags span,.ar-aw .lv,.ar-sg .h,.ar-sg .m,.ar-sf kbd,.sd-c,.cx-th.ini{font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* v33 · home conversation — greeting (bold, grey) · prompt (bold, black, largest) · field (regular, grey) */
body.intro #search{width:min(1180px,calc(100vw - 40px))}
.intro-copy{margin-bottom:14px}
.intro-copy .ig{font-size:clamp(28px,3.1vw,46px);font-weight:700;line-height:1.08;letter-spacing:-.02em;color:#8a8a8a;opacity:1;margin-bottom:6px}
.intro-copy .ip{font-size:clamp(32px,3.6vw,54px);font-weight:700;line-height:1.08;letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
body.intro .sbar{height:auto;padding:6px 20px}
body.intro .sbar input{font-size:clamp(16px,1.45vw,21px);font-weight:400;letter-spacing:-.005em}
body.intro .sbar input::placeholder{color:#8a8a8a;opacity:1}
body.intro #search{top:calc(100% - 9vh - 196px)}
body.timeline .intro-copy .ig{color:#8e8a83}

/* v34 · Collection → linear carousel (ref. kunuminst.org "Linear") */
#lin{position:fixed;inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .5s var(--ease);overflow:hidden;cursor:grab;touch-action:pan-y}
#lin.drag{cursor:grabbing}
body.lin-on #lin{opacity:1;pointer-events:auto}
body.lin-on #stage{opacity:0;pointer-events:none}
body.timeline #lin{display:none}
.ln-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:7px;will-change:transform;padding:0 50vw}
.ln-c{flex:0 0 auto;width:260px;position:relative;border-radius:16px;overflow:clip;opacity:0;translate:0 30px;transition:opacity .6s var(--ease),translate .6s var(--ease);transform-origin:50% 50%}
.ln-c.in{opacity:1;translate:0 0}
.ln-c.dim{opacity:.18!important}
.ln-img{height:260px;cursor:pointer;background:var(--tile);box-shadow:0 20px 50px -30px rgba(0,0,0,.45)}
.ln-img img,.ln-img .pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ln-img::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(23,23,23,.55),rgba(23,23,23,0) 60%);pointer-events:none;z-index:1}
.ln-in{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px;color:#fafafa;display:flex;flex-direction:column;gap:12px;opacity:.75;transition:opacity .3s}
.ln-img:hover .ln-in{opacity:1}
.ln-t{font-size:14px;line-height:1.1;text-wrap:pretty;margin:0;font-weight:400}
.ln-f{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ln-tags{display:flex;gap:4px;flex-wrap:wrap}
.ln-tags span{font-size:9px;line-height:1.5;padding:4px 5px;border-radius:6px;background:#fff;color:#000;white-space:nowrap}
.ln-img:hover .ln-tags span:first-child{background:var(--act)}
.ln-m{font-size:10px;white-space:nowrap;opacity:.9;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ln-txt{padding:18px;background:rgba(26,26,26,.376);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fafafa}
.ln-txt .ln-t{font-size:20px;margin-bottom:14px}
.ln-txt .s{font-size:10px;opacity:.7;margin-bottom:12px}
.ln-hint{position:fixed;left:50%;bottom:184px;transform:translateX(-50%);font-size:10.5px;color:var(--mute);letter-spacing:.04em;z-index:31;opacity:0;transition:opacity .5s;pointer-events:none}
body.lin-on .ln-hint{opacity:1}
.ln-prog{position:fixed;left:50%;bottom:170px;width:160px;height:2px;margin-left:-80px;border-radius:2px;background:var(--line);z-index:31;opacity:0;transition:opacity .5s;overflow:hidden}
.ln-prog i{display:block;height:100%;width:20%;background:var(--ink);border-radius:2px}
body.lin-on .ln-prog{opacity:1}

/* v35 · linear: square cover, cases in their own frame ratio (fixed 260px height), scroll info 32px under the line */
.ln-txt{width:260px;height:260px;display:flex;flex-direction:column}
.ln-txt .ln-f{margin-top:auto}
.ln-img{width:var(--w,260px)}
.ln-hint{bottom:auto;top:calc(50% + 130px + 32px)}
.ln-prog{bottom:auto;top:calc(50% + 130px + 32px + 24px)}
/* v36 · trending card: board on top, member at the bottom; thumb stack sits lower (front thumb 25% cut by the card edge) */
.tu{overflow:hidden}
.tu .l{justify-content:flex-start}
.tu .bd{margin-top:0;font-size:21px;line-height:1.1}
.tu .mt{margin-top:8px}
.tu .who{margin-top:auto}
.tu .nm,.tu .rl{font-size:15px;line-height:1.2;margin-top:0}
.tu .rl{display:block;-webkit-line-clamp:unset;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tu .fan{position:absolute;right:16px;top:0;bottom:0;width:118px}
.tu .fan img:nth-child(1){left:22px;top:54px}
.tu .fan img:nth-child(2){left:11px;top:98px}
.tu .fan img:nth-child(3){left:0;top:142px}
.tu .l{padding-right:122px}

/* v37 · collection actions (follow · ··· · canvas/linear) + scoped search chip */
.crumb .cact{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);position:relative}
.crumb .cact button{height:31px;border:0;border-radius:30px;cursor:pointer;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0 14px;background:var(--pill);color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.crumb .cact button:hover{background:var(--pillh)}
.crumb .cact .fol{background:var(--ink);color:var(--onink)}
.crumb .cact .fol[aria-pressed=true]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.crumb .cact .ic{width:31px;padding:0;justify-content:center}
.crumb .cact .mode svg{flex:0 0 auto}
.cmenu{position:absolute;top:40px;right:0;min-width:200px;padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.35);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:3;text-transform:none}
.cmenu.on{opacity:1;transform:none;pointer-events:auto}
.crumb .cmenu button{display:flex;width:100%;height:auto;background:none;border-radius:10px;padding:9px 10px;font-size:14px;letter-spacing:0;text-transform:none;gap:12px}
.crumb .cmenu button:hover{background:var(--pill)}
/* scope chip inside the search field (ref: "Weddings in au…" chip) */
.scope{display:none;align-items:center;gap:8px;flex:0 1 auto;max-width:46%;height:34px;padding:0 6px 0 4px;border-radius:30px;background:var(--bg);box-shadow:0 0 0 1px var(--line);margin-left:-12px;min-width:0}
.scope.on{display:inline-flex}
.scope img,.scope .ph{width:26px;height:26px;border-radius:9px;object-fit:cover;background:var(--tile);flex:0 0 auto}
.scope span{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.scope button{flex:0 0 auto;width:20px;height:20px;border:0;border-radius:50%;background:var(--pill);color:var(--ink);cursor:pointer;font-size:11px;line-height:1;padding:0}
#sform.scoped svg:first-child{display:none}

/* v38 · no Spatial/Timeline toggle in COLLECTIONS */
body.no-tr .viewtog{opacity:0;pointer-events:none}
/* v39 · no view toggle anywhere; three even tabs, identical in EXPLORE and COLLECTIONS */
.viewtog{display:none!important}
.tabs{gap:4px}
.tabs .tsep,.trtog .stk{display:none!important}
.tabs button,.tabs .trtog{min-width:132px;justify-content:center;padding:0 20px!important;display:inline-flex!important;align-items:center;gap:6px}
.trtog .cv{font-size:10px;opacity:.7}
body:not(.tr-open) .trtog,body.no-tr .trtog{color:var(--mute)!important}
body.tr-open:not(.no-tr) .trtog{background:var(--pill);color:var(--ink)!important}
/* v41 · home: trending searches + skip, no entry icons */
.entry{display:none!important}
body.intro #search{top:50%;transform:translate(-50%,-50%)}
body.intro .sugg{top:calc(100% + 10px);bottom:auto}
.tsr,.skip2{display:none}
body.intro .tsr{display:block;width:100vw;margin:34px 0 0 calc(50% - 50vw)}
body.intro #search.open .tsr{opacity:.25;pointer-events:none}
.tsr-h{text-align:center;font-size:15px;color:var(--ink);margin-bottom:16px;letter-spacing:-.005em}
.tsr-row{display:flex;gap:10px;width:max-content;padding:5px 0;animation:tsr 70s linear infinite}
.tsr-row.r2{animation-duration:84s;animation-direction:reverse;margin-left:-180px}
.tsr:hover .tsr-row{animation-play-state:paused}
.tsr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
@keyframes tsr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tsr-p{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 8px;border-radius:30px;border:0;cursor:pointer;white-space:nowrap;
  background:rgba(250,249,246,.82);box-shadow:0 0 0 1px var(--line),0 6px 20px -14px rgba(0,0,0,.25);font-size:15px;color:var(--ink);transition:background .2s,transform .3s var(--ease)}
.tsr-p:hover{background:#fff;transform:translateY(-2px)}
.tsr-p img,.tsr-p .ph{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--tile);flex:0 0 auto}
body.intro .skip2{display:block;margin:26px auto 0;background:none;border:0;color:var(--mute);font-size:13px;cursor:pointer;letter-spacing:.01em}
.skip2:hover{color:var(--ink)}
body.intro .trtog{background:none!important;color:var(--mute)!important}
/* v42 · home: no field line; "Trending searches · or start exploring →" on one line above the pills */
body.intro .sbar{display:none}
.tsr-line{display:none}
body.intro .tsr-line{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:30px}
body.intro .tsr-line .tsr-h{margin:0;font-size:15px}
body.intro .tsr{margin-top:14px}
body.intro .skip2{display:inline-flex;align-items:baseline;gap:6px;margin:0;padding:4px 2px;font-size:15px;color:var(--mute);position:relative;transition:color .25s}
.skip2::after{content:"";position:absolute;left:2px;right:2px;bottom:1px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.skip2 .sk-ar{display:inline-block;transition:transform .35s var(--ease)}
.skip2:hover{color:var(--ink)}
.skip2:hover::after{transform:scaleX(1)}
.skip2:hover .sk-ar{transform:translateX(5px)}
/* v44 · one chevron (10px, stroked) everywhere */
.chv{width:10px;height:10px;display:block;flex:0 0 auto}
.chev,.cv{display:inline-flex!important;align-items:center;font-size:0!important;line-height:0;vertical-align:middle;transform:none;margin-left:6px}
.fb[aria-expanded=true] .chev{transform:rotate(180deg)}
body.tr-open .trtog .cv{transform:rotate(180deg)}
body.me-open .profile .cv{transform:rotate(180deg)}
.sd-sel span{display:inline-flex}
/* v45 · search ↔ filters swap; search takes the dark "reading bar" language (case page / credits bar) */
body:not(.intro) #search{top:calc(100% - 22px);transform:translate(-50%,-100%)}
#filters{bottom:76px}
.menu{bottom:136px}
body:not(.intro) .sbar{height:46px;border-radius:16px;padding:0 10px 0 16px;background:rgba(26,26,26,.38);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:0;box-shadow:0 20px 50px -30px rgba(0,0,0,.45);color:#fafafa}
body.timeline:not(.intro) .sbar{background:rgba(255,255,255,.1)}
body:not(.intro) .sbar svg{opacity:.75;color:#fafafa}
body:not(.intro) .sbar input{color:#fafafa}
body:not(.intro) .sbar input::placeholder{color:rgba(250,250,250,.6)}
body:not(.intro) .sbar .enter{display:none}
.sbar .sk{display:none}
body:not(.intro) .sbar .sk{display:inline-block;font:10px/1 var(--ffm);color:rgba(250,250,250,.65);border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 6px}
body:not(.intro) .sugg{bottom:calc(100% + 10px)}
/* selected keyword / scope = white chip with ink text (like the active credits chip "The work") */
.scope{background:#fff;box-shadow:none;border-radius:9px;height:32px;margin-left:-6px;padding:0 5px 0 4px}
.scope span{color:#000}
.scope img,.scope .ph{width:24px;height:24px;border-radius:6px}
.scope button{background:rgba(0,0,0,.08);color:#000}
.qchip{background:#fff;color:#000;border-radius:9px;padding:5px 6px 5px 10px;box-shadow:0 0 0 1px var(--line)}
.qchip button{background:rgba(0,0,0,.08);color:#000}
/* v46 · action colour (was green) */
:root{--act:#ED794E}
/* filter menus: opaque panel + AA-contrast list (was --faint #b9b4aa on glass) */
.menu{background:rgba(246,244,240,.97);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
body.timeline .menu{background:rgba(24,24,24,.97)}
.big{color:#5f5b55}
body.timeline .big{color:#b4afa7}
.big:hover,.big[aria-pressed=true]{color:var(--ink)}
.big[aria-pressed=true]{font-weight:500}
.big sup{color:#5f5b55}
body.timeline .big sup{color:#b4afa7}
.big[disabled]{opacity:.55!important;color:#6f6b64}
.big[disabled] sup{color:#6f6b64}
.menu .lbl{color:#5f5b55}
/* open search = same reading as the case-page search dropdown (dark panel, white text, mono meta) */
body:not(.intro) .sugg{background:rgba(32,32,32,.86);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:0;color:#fafafa;padding:12px;border-radius:18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
body:not(.intro) .sugg .lbl{font:9.5px/1.4 var(--ffm);letter-spacing:.06em;text-transform:uppercase;color:rgba(250,250,250,.6);font-weight:400;margin:4px 8px 8px}
body:not(.intro) .sugg .chips{padding:0 8px}
body:not(.intro) .sugg .chip{background:rgba(255,255,255,.12);border-color:transparent;color:#fafafa}
body:not(.intro) .sugg .chip:hover,body:not(.intro) .sugg .chip.kb{background:#fff;color:#000}
body:not(.intro) .sugg .rowr{margin:0;width:100%;padding:6px 8px;color:#fafafa}
body:not(.intro) .sugg .rowr:hover,body:not(.intro) .sugg .rowr.kb{background:rgba(255,255,255,.1)}
body:not(.intro) .sugg .rowr img{width:46px;height:34px;background:#3a3a3a}
body:not(.intro) .sugg .rowr .t{font-size:13px;line-height:1.2}
body:not(.intro) .sugg .rowr .m{font:9.5px/1.4 var(--ffm);color:rgba(250,250,250,.6)}
body:not(.intro) .sugg .rowr .ico{color:rgba(250,250,250,.6)}
body:not(.intro) .sugg mark{color:#fff}
body:not(.intro) .sugg .sg-foot{color:rgba(250,250,250,.6);margin:10px 8px 2px}
body:not(.intro) .sugg .sub{color:rgba(250,250,250,.6);padding:0 8px}
/* v47 · orange hover in the filters (bar + menus) */
.big:hover,.big[aria-pressed=true]:hover{color:var(--act)}
.big:hover sup{color:var(--act)}
.big[disabled]:hover{color:#6f6b64}
#filters .fb:hover{color:var(--act)}
#filters .fb:hover .chv{color:var(--act)}
/* v48 · bottom action row keeps its width on small frames */
.fi-credits .cbtn{width:auto;min-width:200px;margin:0 auto;display:block}
/* v49 · Save under AGENCY, See more under CLIENT (centred on the side columns) */
.fi-btn.c{transform:translate(-50%,-50%)}
/* v50 · Save · Credits · See more as one row, 48px apart, any frame size (credits block fixed 200px) */
.fi-credits{width:200px}
.fi-credits .cbtn{min-width:0;width:200px}
.fi-btn.gl{transform:translate(-100%,-50%)}
.fi-btn.gr{transform:translate(0,-50%)}
/* v52 · frames: original proportion, fully visible, 8px radius */
.ar-hero{border-radius:8px;background:transparent}
.ar-hero>img{object-fit:contain}
.ar-hero .pv{object-fit:contain;background:#111}
.tile,.tl-frame,.ln-c,.ln-img,.tl-col .im,.cx-th,.me-row button,.ar-sg img,.rowr img,.tsr-p img{border-radius:8px}
.tile.focused{border-radius:8px}
.tsr-p img{border-radius:50%}
@media (prefers-reduced-motion:reduce){.tsr-row{animation:none}}
@media (prefers-reduced-motion:reduce){#world,#search,#filters,.menu{transition:none!important}}
</style>
</head>

function makeItemField(list,{wrap=true,cols=16,rows=0,blob=false}={}){

  if(blob){cols=Math.max(3,Math.ceil(Math.sqrt(list.length*1.9)));rows=Math.max(2,Math.ceil(list.length/cols)+1)}
  const slots=slotsCenterOut(cols,rows,cw,ch);
  const ents=list.map((it,k)=>({kind:'item',item:it._dup?ITEMS[it.idx]:it,c:slots[k].c,r:slots[k].r,key:'i'+it.idx+(it._dup?'d'+k:'')}));

  if(!t||!t._ent||!PV(t._ent.item)||document.body.classList.contains('intro')||t.classList.contains('focused'))return;
  hoverTile=t;hoverTimer=setTimeout(()=>{if(hoverTile===t&&!down&&!t.querySelector('.pv'))t.insertBefore(makeVideo(PV(t._ent.item)),t.querySelector('.sv'))},380);
});
// cursor-driven drift (design.cash.app): the further the pointer is from the centre, the faster the network travels that way
let overStage=false,overTile=false;const drift={x:0,y:0};
document.addEventListener('pointermove',ev=>{overStage=!!ev.target.closest('#stage')&&!ev.target.closest('.ib');overTile=!!ev.target.closest('.ent');if(overStage)mouse={x:ev.clientX,y:ev.clientY}});
document.addEventListener('pointerleave',()=>{overStage=false});
function driftStep(){
  let tx=0,ty=0;
  const ok=mouse&&overStage&&!down&&!focus&&!tgt.active&&field&&field.wrap&&!document.body.classList.contains('intro')
    &&!document.querySelector('.menu.on')&&!sbox.classList.contains('open');
  if(ok){const f=n=>{const a=Math.abs(n),dz=.28;return Math.sign(n)*Math.pow(Math.max(0,(a-dz)/(1-dz)),2)};
    const k=overTile?.35:1;tx=f((mouse.x-W/2)/(W/2))*7.5*k/cam.z;ty=f((mouse.y-CYf())/(H/2))*5.5*k/cam.z}
  drift.x+=(tx-drift.x)*.06;drift.y+=(ty-drift.y)*.06;
  if(Math.abs(drift.x)>.01||Math.abs(drift.y)>.01){cam.x+=drift.x;cam.y+=drift.y}
}
stage.addEventListener('pointerup',()=>{
  if(!down)return;stage.classList.remove('dragging');
  if(!dragging){
    if(document.body.classList.contains('intro')){activate()}
    else{const t=down.target.closest('.ent');const L=t&&[...live.values()].find(l=>l.el===t);
      if(L&&L.e.kind==='item'){if(focus&&focus.k===L.k)clearFocus();else setFocus(L)}
      else if(L&&L.e.kind==='cluster')openCollection(L.e.cluster);
      else if(focus)clearFocus();}
  }
  dragging=false;down=null;
});
stage.addEventListener('wheel',ev=>{
  ev.preventDefault();tgt.active=false;activate();
  if(ev.ctrlKey||ev.metaKey)zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*.01));
  else{cam.x+=ev.deltaX/cam.z;cam.y+=ev.deltaY/cam.z;wheelAcc+=Math.abs(ev.deltaX)+Math.abs(ev.deltaY);if(focus&&wheelAcc>140)clearFocus()}
  if(!focus)wheelAcc=0;
},{passive:false});
function zoomAt(px,py,f){const nz=Math.min(1.4,Math.max(.38,cam.z*f));const CY=CYf(),wx=cam.x+(px-W/2)/cam.z,wy=cam.y+(py-CY)/cam.z;
  cam.z=nz;cam.x=wx-(px-W/2)/nz;cam.y=wy-(py-CY)/nz}
$('#zin').onclick=()=>{if(state.view==='timeline'){tlDensity(-1);return}tgt.active=false;zoomAt(W/2,H/2,1.25)};
$('#zout').onclick=()=>{if(state.view==='timeline'){tlDensity(1);return}if(focus)clearFocus();tgt.active=false;zoomAt(W/2,H/2,.8)};
addEventListener('keydown',ev=>{
  const inInput=ev.target===qi;
  if(ev.key==='/'&&!inInput){ev.preventDefault();qi.focus();return}
  if(ev.key==='Escape'){
    if(inInput||$('#search').classList.contains('open')){closeSugg();qi.value=state.query;qi.blur();activate();return}
    if(document.querySelector('.menu.on')){closeMenus();return}
    if(state.view==='timeline'){if(tl.stage==='solo')tlCloseSolo();else if(tl.stage==='arc'&&!state.collection&&state.tab!=='personal'){state.disc=null;ui();tlDial()}else if(tl.year){tl.year=null;tlDial()}return}
    if(focus){clearFocus();return}
    if(state.collection){closeCollection();return}
    activate();return}
  if(inInput)return;
  if(state.view==='timeline'){if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();tlStep(ev.key==='ArrowRight'?1:-1)}return}
  if(focus&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(ev.key)){ev.preventDefault();
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
    const g=[focus.gc+d[0],focus.gr+d[1]];const L=[...live.values()].find(l=>l.gc===g[0]&&l.gr===g[1]&&l.e.kind==='item');if(L)setFocus(L);return}
  if(ev.key==='Enter'){const a=document.activeElement;const L=a&&[...live.values()].find(l=>l.el===a);
    if(L&&L.e.kind==='cluster')openCollection(L.e.cluster);else if(L&&L.e.kind==='item'&&!focus)setFocus(L)}
});

function frame(){
  if(arVideo){const p=document.querySelector('#arHero .fi-prog i');if(p)p.style.width=Math.min(100,arVideo.currentTime/PREVIEW_S*100)+'%'}
  const pv=state.view==='timeline'?tl.video:focusVideo;
  if(pv){const p=document.querySelector(state.view==='timeline'?'.tl-fw:not(.out) .fi-prog i':'#info .fi-prog i');if(p)p.style.width=Math.min(100,pv.currentTime/PREVIEW_S*100)+'%'}
  if(state.view==='timeline'){tlFrame();requestAnimationFrame(frame);return}
  if(tgt.active){const k=.1;cam.x+=(tgt.x-cam.x)*k;cam.y+=(tgt.y-cam.y)*k;cam.z+=(tgt.z-cam.z)*k;
    if(Math.abs(tgt.x-cam.x)<.2&&Math.abs(tgt.y-cam.y)<.2&&Math.abs(tgt.z-cam.z)<.0008){cam.x=tgt.x;cam.y=tgt.y;cam.z=tgt.z;tgt.active=false}}
  else if(!down&&(Math.abs(vel.x)>.03||Math.abs(vel.y)>.03)){cam.x+=vel.x;cam.y+=vel.y;vel.x*=.93;vel.y*=.93}
  else if(document.body.classList.contains('intro')&&!down){cam.x+=.35;cam.y+=.12}
  if(!tgt.active)driftStep();
  {const want=trVisible()?TRH:0;topOff+=(want-topOff)*.09;if(Math.abs(want-topOff)<.3)topOff=want;stage.style.setProperty('--stm',(topOff>1?66+topOff*.86:0)+'px')}
  world.style.transform=`translate3d(${W/2-cam.x*cam.z}px,${CYf()-cam.y*cam.z}px,0) scale(${cam.z})`;
  update();requestAnimationFrame(frame);
}

const has=(it,code)=>it.aws.some(s=>s.startsWith(code+':'));
const AWARD_COLS=(()=>{const C=[];
  [2026,2025].forEach(y=>{let Y=ITEMS.filter(i=>i.y===y);
  const Y2=Y;Y=Y2.filter(i=>i.show==='OS');
    C.push({t:'Best of Show',sub:`@theoneshow · ${y}`,items:Y.filter(i=>i.aw==='BOS'||i.aw==='BONP')});
    C.push({t:'Best of Discipline',sub:`@theoneshow · ${y}`,items:Y.filter(i=>has(i,'BOD'))});
    C.push({t:'Special Pencils',sub:`@theoneshow · ${y}`,items:Y.filter(i=>i.aws.some(s=>AW[s.split(':')[0]].lv==='special'))});
    C.push({t:'Gold Pencil',sub:`@theoneshow · ${y}`,items:Y.filter(i=>i.aw==='GOLD')})});
  [['ADC','@adc · 105th · 2026'],['ADCE','@adceurope · 2025'],['OA','@oneasia · 2025']].forEach(([sh,sub])=>{const I=ITEMS.filter(i=>i.show===sh);if(I.length)C.push({t:SHOWS[sh].s,sub,items:I})});
  DISCS.slice(0,8).forEach(([d])=>C.push({t:d,sub:'@jury · 2025–26',items:ITEMS.filter(i=>i.discs.includes(d))}));
  return shuffle(C,3).map(c=>({...c,items:c.items.sort((a,b)=>a.rank-b.rank)}))})();
function personalCollections(){
  const S=state.saved.map(i=>ITEMS[i]),sv=new Set(state.saved),C=[];
  C.push({t:'Moodboard',sub:`@bruno · ${S.length} saved`,items:S.slice().reverse(),mood:true});
  if(S.length){const last=S[S.length-1];
    C.push({t:`Because you saved “${last.t}”`,sub:'@for you',items:ITEMS.filter(i=>!sv.has(i.idx)&&i.discs.some(d=>last.discs.includes(d))).sort((a,b)=>a.rank-b.rank).slice(0,14)});
    const df={};S.forEach(i=>i.discs.forEach(d=>df[d]=(df[d]||0)+1));const topD=Object.entries(df).sort((a,b)=>b[1]-a[1])[0];
    if(topD)C.push({t:`Your discipline: ${topD[0]}`,sub:'@for you',items:ITEMS.filter(i=>!sv.has(i.idx)&&i.discs.includes(topD[0])).slice(0,14)});
    const af={};S.forEach(i=>af[i.agencyKey]=(af[i.agencyKey]||0)+1);
    const topA=Object.entries(af).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).find(a=>ITEMS.some(i=>!sv.has(i.idx)&&i.agencyKey===a));
    if(topA)C.push({t:`More from ${topA}`,sub:'@for you',items:ITEMS.filter(i=>!sv.has(i.idx)&&i.agencyKey===topA)})}
  if(state.viewed.length)C.push({t:'Recently viewed',sub:'@bruno',items:state.viewed.slice().reverse().map(i=>ITEMS[i])});
  C.push({t:'New this year',sub:'@for you · 2026',items:ITEMS.filter(i=>i.y===2026&&!sv.has(i.idx)&&i.rank<=2)});
  return C.filter(c=>c.items.length||c.mood);
}

function swap(nf,cx,cy,z){
  clearFocus();world.classList.add('fade');
  setTimeout(()=>{for(const [,L] of live)L.el.remove();live.clear();field=nf;cam.x=cx;cam.y=cy;cam.z=z*.82;prevCam={x:cx,y:cy};flyTo(cx,cy,z);
    requestAnimationFrame(()=>world.classList.remove('fade'))},field?240:0);
}
function setTab(t){
  if(t==='awards'&&trOpen&&state.tab!=='awards'){trOpen=false}
  if(t==='awards'&&state.view==='timeline'){state.tab=t;setView('spatial')}
  state.tab=t;state.collection=null;linClose();
  document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  if(t==='explore')swap(makeItemField(ordered(ITEMS,state.arrange)),0,0,.78);
  if(t==='awards')swap(makeClusterField(AWARD_COLS),0,60,.74);
  ui();trSync();if(state.view==='timeline')tlBuild();
}
function isLinearCol(cl){return !!cl&&(cl.trend||(state.tab==='awards'&&!cl.from))}
function openCollection(cl){
  if(!cl.items.length)return;state.collection=cl;activate();
  if(cl!==scopeCl){scopeOn=true;scopeCl=cl}
  if(isLinearCol(cl)&&state.view==='spatial'&&colMode==='linear'){clearFocus();linOpen(cl);ui();trSync();return}
  linClose();
  const f=makeItemField(ordered(cl.items,state.arrange==='standard'?'award':state.arrange),{wrap:false,blob:true});
  const z=Math.max(.5,Math.min(1,(W-120)/(f.cols*f.cw),(H-260)/(f.rows*f.ch)));
  swap(f,0,10,z);ui();trSync();if(state.view==='timeline')tlBuild();
}
function closeCollection(){if(scopeOn&&state.query){state.query='';qi.value=''}scopeOn=true;setTab(state.tab)}
function relayout(){
  if(state.view==='timeline')setTimeout(tlRefresh,0);
  // keep the same elements; give them new slots so they glide to their new place
  if(!field||field.kind!=='items')return ui();
  const list=state.collection?ordered(state.collection.items,state.arrange==='standard'?'award':state.arrange):ordered(ITEMS,state.arrange);
  const slots=slotsCenterOut(field.cols,field.rows,field.cw,field.ch);
  const pos=new Map(list.map((it,k)=>[it.idx,slots[k]]));
  if(focus)clearFocus();
  let extra=list.length;field.ents.forEach(e=>{const dup=/d\d+$/.test(e.key);const s=dup?slots[extra++]:pos.get(e.item.idx);if(s){e.c=s.c;e.r=s.r}});
  ui();
}

function hl(text,q){const T=qTokens(q);let h=esc(text);T.forEach(t=>{if(t.length<2)return;const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');h=h.replace(re,'<mark>$1</mark>')});return h}
function renderSugg(){
  const q=qi.value.trim();let h='';
  if(!q){
    const rel=[['Best of Show 2026','best of show 2026'],['Creative Use of AI','creative use of ai'],['Film & Video','film & video'],['Health & Wellness','health & wellness'],['Out of Home','out of home'],['Social Media','social media']];
    const S=state.saved.map(i=>ITEMS[i]);const last=S[S.length-1];

  }else{
    const res=ITEMS.filter(it=>matches(it,q)).sort((a,b)=>a.rank-b.rank);
    const facets=[];const T=qTokens(q).join(' ');
    if(T){DISCS.forEach(([d])=>{if(norm(d).includes(T))facets.push(['Discipline',d])});
      [...new Set(ITEMS.map(i=>i.agencyKey))].forEach(a=>{if(norm(a).includes(T))facets.push(['Agency',a])});
      [...new Set(ITEMS.map(i=>i.c))].forEach(c=>{if(norm(c).includes(T))facets.push(['Client',c])})}
    if(facets.length)h+=`<div class="sg-sec"><div class="lbl">Filters</div><div class="chips">${facets.slice(0,6).map(([k,v])=>`<button class="chip" data-q="${esc(v)}">${k} · ${esc(v)}</button>`).join('')}</div></div>`;

}

function tlBase(){

  if(state.tab==='personal'){const seen=new Set(),L=[];personalCollections().forEach(c=>c.items.forEach(i=>{if(!seen.has(i.idx)){seen.add(i.idx);L.push(i)}}));return L}
  return ITEMS;
}
function tlCats(){
  if(state.tab==='awards'&&!state.collection)return AWARD_COLS.map(c=>({t:c.t+(c.sub.match(/\d{4}/)?' '+c.sub.match(/\d{4}/)[0]:''),items:c.items}));
  const base=tlBase();const m=new Map();
  base.forEach(it=>{(it.discs.length?it.discs:[it.category]).forEach(d=>{if(!m.has(d))m.set(d,[]);m.get(d).push(it)})});
  return [...m.entries()].filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length).map(([t,items])=>({t,items}));
}
function tlPass(it){return passes(it)&&(!tl.year||it.y===tl.year)}
function tlOrder(L){L=L.filter(tlPass);
  if(state.arrange==='award')return L.sort((a,b)=>a.rank-b.rank||a.y-b.y);
  return L.sort((a,b)=>a.y-b.y||a.rank-b.rank||a.t.localeCompare(b.t));}

function clearOrb(){orb.querySelectorAll('.cnode,.athumb,.atick,.alab').forEach(e=>e.remove());tl.nodes=[];tl.thumbs=[];tl.ticks=[];tl.labs=[];orbG.innerHTML=''}

/* ---- 1 + 2. one semicircle for both levels: categories, then the cases of a category ---- */

function tlArc(entries,mode,from){

  tl.list=entries;const n=entries.length;

    t._x=fx;t._y=fy;t._s=.3;t._o=0;t._i=i;t._r=0;
    const act=()=>{if(tlDragMoved>4)return;if(mode==='cats')tlOpenCat(e.cat,t);else if(tl.stage==='solo'&&tl.sel===i)window.open(e.url,'_blank','noopener');else{tlRotateTo(i);tlSolo(i)}};

function tlDial(){

function tlOpenCat(c,from){tlCloseSolo(true);tl.cat=c;tlArc(tlOrder(c.items.slice()),'cases',from)}
function tlCrumb(){
  if(state.view!=='timeline')return;
  const allLabel=state.tab==='awards'?'All collections':state.tab==='personal'?'For you':'All categories';
  const toAll=()=>{tl.year=null;state.disc=null;state.query='';qi.value='';ui();tlDial()};
  const P=[];
  if(state.collection||state.tab==='personal'){P.push({t:state.collection?(state.collection.from||(state.tab==='awards'?'Collections':'Explore')):'For you',fn:state.collection?closeCollection:null})}

  if(yr&&!(state.collection||state.tab==='personal'))P.push({t:String(yr),fn:(tl.mode==='cats')?null:()=>{tl.year=yr;state.disc=null;state.query='';qi.value='';ui();tlDial()}});
  if(tl.mode==='cases'&&tl.cat)P.push({t:tl.cat.t,fn:tl.stage==='solo'?()=>tlCloseSolo():null});
  if(tl.stage==='solo'&&cur)P.push({t:cur.t});

function tlRotateTo(i){tl.to=Math.max(0,Math.min(tl.list.length-1,i));tl.idle=0}
function tlStep(d){if(tl.stage==='solo'){tlSolo(Math.max(0,Math.min(tl.list.length-1,tl.sel+d)));return}tlRotateTo(Math.round(tl.to)+d)}
function tlToggleAuto(){}
function soloFrame(it){
  // same on-screen size and position as an open case in Spatial (focusFrame × the Spatial focus zoom)
  const F=focusFrame(it),z=Math.max(.6,Math.min(1.05,(H-200)/(F.h+330),(W-80)/(F.w+480)));
  return{w:F.w*z,h:F.h*z,cy:H/2-12}}
function tlFrame(){
  if(tl.stage!=='arc'&&tl.stage!=='solo'&&tl.stage!=='cats')return;
  const n=tl.list.length;if(!n)return;const {cx,cy,R}=geo();const K=Math.min(tl.K,Math.max(n,2));
  if(performance.now()-tl.idle>170&&!tlDragging)tl.to=Math.round(tl.to);
  tl.to=Math.max(0,Math.min(n-1,tl.to));tl.o+=(tl.to-tl.o)*.12;
  const half=Math.max(1,(K-1)/2);
  const spacing=Math.max(150,W*1.02/(K-1));const step=spacing/R;
  const size=Math.max(90,Math.min(260,spacing*.86));
  const solo=tl.stage==='solo',SF=solo?soloFrame(tl.list[tl.sel]):null;
  // in solo the arc opens: the neighbours slide outwards so nothing sits under the info
  let th0=0;if(solo){const need=SF.w/2+300+size*.32;th0=Math.asin(Math.min(.98,need/R))}
  tl.thumbs.forEach((t,i)=>{
    const e=tl.list[i],ratio=tl.mode==='cats'?e.rep.ratio:e.ratio;let d=i-tl.o;
    let th=d*step,sc=(1-.5*Math.min(1,Math.abs(d)/half))*(t._hov&&!solo?1.06:1);
    let w=ratio>=1?size:size*ratio,h=ratio>=1?size/ratio:size;
    let x,y,rot;
    if(solo&&i===tl.sel){x=cx;y=SF.cy;w=SF.w;h=SF.h;sc=1;rot=0}
    else{
      if(solo){const ds=i-tl.sel;th=Math.sign(ds)*(th0+(Math.abs(ds)-1)*step*.75);sc*=.62}
      x=cx+R*Math.sin(th);y=cy-R*Math.cos(th);rot=th*180/Math.PI;}
    const vis=solo?Math.abs(x-cx)<W/2+w:Math.abs(d)<=half+1.6;
    t._x+=(x-t._x)*.14;t._y+=(y-t._y)*.14;t._s+=(sc-t._s)*.14;t._r=(t._r??rot)+(rot-(t._r??rot))*.14;
    t._w=(t._w??w)+(w-(t._w??w))*.14;t._h=(t._h??h)+(h-(t._h??h))*.14;t._o+=((vis?1:0)-t._o)*.14;
    t.style.width=t._w.toFixed(1)+'px';t.style.height=t._h.toFixed(1)+'px';t.style.borderRadius=(8/t._s).toFixed(1)+'px';
    t.style.transform=`translate3d(${(t._x-t._w/2).toFixed(1)}px,${(t._y-t._h/2).toFixed(1)}px,0) rotate(${t._r.toFixed(2)}deg) scale(${t._s.toFixed(3)})`;
    t.style.opacity=t._o.toFixed(3);if(!(solo&&i===tl.sel))t.style.zIndex=Math.round(100-Math.abs(d)*4);t.style.pointerEvents=vis?'auto':'none';
    t._hh=t._h*t._s/2;
    const tk=tl.ticks[i];if(tk){const th2=solo?th:d*step,r2=R-t._hh-18;tk._r2=r2;tk.style.transform=`translate(${cx+r2*Math.sin(th2)}px,${cy-r2*Math.cos(th2)}px)`;tk.style.opacity=Math.abs(d)<=half+1?1:0}
  });
  tl.labs.forEach(lb=>{const d=lb._i-tl.o,th=d*step,tk=tl.ticks[lb._i],r3=(tk&&tk._r2?tk._r2:R-size*.5-18)-18-6;lb.style.left=(cx+r3*Math.sin(th))+'px';lb.style.top=(cy-r3*Math.cos(th))+'px';lb.style.opacity=Math.abs(d)<=half+1?1:0});
  const cur=Math.round(tl.o);if(cur!==tl.curShown&&tl.mode==='cases'){tl.curShown=cur;if(!tl.hover)tlCenter(null);tlCrumb()}
}
/* ---- 3. isolated case: the clicked thumb itself grows to the centre, the arc opens around it ---- */
function tlSolo(i){

  const pre=new Image();pre.onload=()=>{if(tl.sel===i&&tl.stage==='solo')img.src=it.big};pre.src=it.big;

  killVideo(t.querySelector('.pv'));const img=t.querySelector('img');if(img&&it&&it.thumb)img.src=it.gridSrc||it.thumb;t.classList.remove('sel')}
