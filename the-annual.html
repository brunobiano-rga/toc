/* ================= CREDITS MODE — stacked cards =================
   Clicking Credits pushes the case up and raises a vertical column of modules (The work · Awards · one module
   per credit area). Inside a module the cards stick and pile up as you scroll; the next module pushes the pile
   away. The top bar jumps between areas and tracks where you are. Visual language: kunuminst.org/content. */
const CR_AREAS=[
 ['Companies',r=>/(agency|company|firm|studio|publisher)$/i.test(r)||/^freelancer$/i.test(r)],
 ['Client',r=>/^client( \/ brand)?$|marketing officer|\bcmo\b|brand management|communications/i.test(r)],
 ['Post & Sound',r=>/editor|post-|composer|sound|music|colou?r|animator|motion/i.test(r)],
 ['Production',r=>/producer|production|photograph|\bdop\b|cinematograph|film director|^director$|assistant director|animation director|project manager/i.test(r)],
 ['Strategy & Account',r=>/strateg|account|business|client (director|lead)|\bceo\b|chief executive|president|management|manager|founder|chairman|technology officer|product/i.test(r)],
 ['Creative',r=>/creative|art|copy|writer|design|typograph|illustrat|artist|content|cco/i.test(r)],
 ['Other',()=>true]];
const CR_ORDER=['Companies','Creative','Strategy & Account','Production','Post & Sound','Client','Other'];
const crx=$('#crx'),cxCol=$('#cxCol'),cxScroll=$('#cxScroll'),cxBar=$('#cxBar');
let cxCtx=null,cxIO=null;
const mono=s=>esc(s);
function cxCard(k,{title,tags=[],meta='',thumb='',sub='',href='',cls='',act=''},stickTop){
  const tag=href?`a href="${href}" target="_blank" rel="noopener"`:(act?`button data-cx="${act}"`:'div');
  const end=href?'a':(act?'button':'div');
  return `<div class="cx-card ${cls}" style="top:${stickTop}px"><${tag} class="cx-in"><div class="cx-row">
    <div class="cx-txt"><div><h3 class="cx-t">${title}</h3>${sub?`<div class="cx-sub">${sub}</div>`:''}</div>
      ${tags.length?`<div class="cx-tags">${tags.map(t=>`<span class="cx-tag">${mono(t)}</span>`).join('')}</div>`:''}</div>
    ${thumb||meta?`<div class="cx-side">${thumb||"<span></span>"}${meta?`<span class="cx-m">${meta}</span>`:'<span></span>'}</div>`:''}
  </div></${end}></div>`;
}
const POS=['50% 50%','20% 30%','80% 40%','40% 80%','70% 20%','30% 60%','60% 70%','10% 10%','90% 90%'];
function openCredits(it,where){
  cxCtx={it,where};if(where==='timeline')tl.hold=true;
  if(where==='spatial'&&focusVideo)focusVideo.pause();if(where==='timeline'&&tl.video)tl.video.pause();
  // group credits by area
  const G={};it.cr.forEach(([r,n])=>{const a=CR_AREAS.find(([,f])=>f(r))[0];(G[a]=G[a]||[]).push([r,n])});
  const mods=[];const a=AW[it.aw];
  const icon=i=>i?`<span class="cx-th ic"><img src="${ICON(i)}" alt="" onerror="this.parentNode.classList.remove('ic');this.remove()"></span>`:'';
  // 1 · the work
  mods.push({k:'work',t:'The work',n:'',html:`<div class="cx-card cx-hero" style="position:relative"><div class="cx-in"><div class="cx-img"><img src="${it.gridSrc||it.big}" alt=""></div>
     <div class="cx-row" style="--fo:1.54"><div class="cx-txt"><div><h3 class="cx-t">${esc(it.t)}</h3><div class="cx-sub">${esc(it.c)} · ${esc(it.agencyMain)}</div></div>
     <div class="cx-tags">${[...new Set([a.l,SHOWS[it.show].s+" "+it.y,it.category])].map(t=>`<span class="cx-tag">${esc(t)}</span>`).join("")}</div></div>
     <div class="cx-side"><span></span><span class="cx-m">${it.n} credits</span></div></div></div></div>`});
  // 2 · awards
  mods.push({k:'awards',t:'Awards',n:it.aws.length,cards:it.aws.map(s=>{const [code,...rest]=s.split(':');const A=AW[code];
    return{title:esc(rest.join(':')||A.l),tags:[A.l,`${SHOWS[it.show].s} ${it.y}`],thumb:icon(A.i)||`<span class="cx-th ini" style="background:#1a1a1a">${A.l.split(' ').map(w=>w[0]).join('').slice(0,3)}</span>`,meta:A.lv==='best'?'Best of':A.lv==='special'?'Special':'Gold'}})});
  // 3 · one module per credit area
  CR_ORDER.filter(k=>G[k]).forEach(k=>{
    mods.push({k:k.toLowerCase().replace(/[^a-z]+/g,'-'),t:k,n:G[k].length,cards:G[k].map(([r,n],i)=>{
      const company=k==='Companies'||k==='Client'&&/ \/ /.test(n);
      const names=n.split(/,\s*/);const nm=company?n.split(' / ')[0]:n;const place=company&&n.includes(' / ')?n.split(' / ').slice(1).join(' / '):'';
      const cap=(company?nm:names[0]).split(' ')[0].toUpperCase();
      return{title:esc(nm),tags:[r,...(company?[]:[k])],
        thumb:company?`<span class="cx-th"><img src="${it.thumb}" alt="" style="object-position:${POS[i%POS.length]}" onerror="this.remove()"><b>${esc(cap)}</b></span>`:'',
        meta:company?esc(place):(names.length>1?`${names.length} people`:'1 person')}})})});
  // last · out
  mods.push({k:'more',t:'More',n:'',cards:[{title:`Full credits for ${esc(it.t)}`,tags:[`${it.n} credit${it.n===1?'':'s'}`,'oneclub.org'],meta:'↗',href:it.url,cls:'cx-end'},
    {title:'Back to the case',tags:['Esc'],meta:'↑',act:'close',cls:'cx-end'}]});
  // render
  cxCol.innerHTML=mods.map(m=>`<section class="cx-mod" id="cx-${m.k}" data-k="${m.k}">
     ${m.k!=='work'?`<div class="cx-lbl"><span>${esc(m.t)}</span>${m.n?`<i>${m.n}</i>`:''}</div>`:''}
     ${m.html||m.cards.map((c,i)=>cxCard(i,c,108+Math.min(i,5)*12)).join('')}</section>`).join('');
  cxBar.innerHTML=`<div class="chips">${mods.map(m=>`<button class="cx-chip" data-go="${m.k}">${esc(m.t)}${m.n?`<sup>${m.n}</sup>`:''}</button>`).join('')}</div><button class="cx-x" data-cx="close" aria-label="Close credits">×</button>`;
  cxScroll.scrollTop=0;
  crx.setAttribute('aria-hidden','false');document.body.classList.add('crx-on','credits-open');
  // reveal on enter (cards rise 30px and fade in, like the reference)
  if(cxIO)cxIO.disconnect();
  cxIO=new IntersectionObserver(E=>E.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');cxIO.unobserve(e.target)}}),{root:cxScroll,threshold:.15});
  [...cxCol.querySelectorAll('.cx-card')].forEach((c,i)=>{if(i<3)setTimeout(()=>c.classList.add('in'),250+i*90);else cxIO.observe(c)});
  cxStack();
}
var cxBack=false;
function closeCredits(){
  if(!cxCtx)return;const {where,it}=cxCtx;cxCtx=null;
  if(cxBack){cxBack=false;document.body.classList.remove('crx-on');crx.setAttribute('aria-hidden','true');openCase(it,where);return}
  document.body.classList.remove('crx-on','credits-open');crx.setAttribute('aria-hidden','true');

// stacking: a stuck card gets smaller and dimmer for every card piled on top of it
function cxStack(){
  const mods=[...cxCol.querySelectorAll('.cx-mod')];let cur=mods[0];
  mods.forEach(m=>{
    const cards=[...m.querySelectorAll('.cx-card:not(.cx-hero)')];const tops=cards.map(c=>c.getBoundingClientRect().top);
    cards.forEach((c,i)=>{const T=parseFloat(c.style.top);let d=0;
      for(let j=i+1;j<cards.length;j++){const Tj=parseFloat(cards[j].style.top);if(tops[j]<=Tj+.5)d++;else{const dist=tops[j]-Tj;d+=Math.max(0,1-dist/140);break}}
      const inner=c.firstElementChild;inner.style.setProperty('--sc',(1-Math.min(d,4)*.04).toFixed(3));inner.style.setProperty('--fo',Math.max(0,1-d*1.25).toFixed(3))});
    if(m.getBoundingClientRect().top<innerHeight*.45)cur=m});
  cxBar.querySelectorAll('.cx-chip').forEach(b=>b.setAttribute('aria-current',b.dataset.go===cur.dataset.k));
  const a=cxBar.querySelector('[aria-current=true]');if(a&&cxBar._last!==a){cxBar._last=a;a.scrollIntoView({inline:'nearest',block:'nearest'})}

  if(t.dataset.follow!==undefined){return}
  if(t.dataset.rt==='info'){document.body.classList.remove('ppl-on');const o=!document.body.classList.contains('side-on');document.body.classList.toggle('side-on',o);
    $('#arRt [data-rt=info]').setAttribute('aria-expanded',o);if(o&&t.dataset.rt==='savers')setTimeout(()=>{const e=$('#arSide .sd-tabs');if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},300);return}
  if(t.dataset.rt==='dd'){const d=$('#sdDd');d.classList.toggle('open');if(d.classList.contains('open'))setTimeout(()=>{d.scrollIntoView({block:'nearest',behavior:'smooth'});const i=d.querySelector('input');if(i)i.focus({preventScroll:true})},60);return}
  if(t.dataset.mi==='share'){try{navigator.clipboard.writeText(it.url)}catch(e){}toast('Link copied');return}
  if(t.dataset.mi==='download'){toast('Download · Premium & Golden members');return}
  if(t.dataset.mi==='find'){window.open(it.url,'_blank','noopener');return}
  if(t.dataset.mi==='report'){toast('Thanks — sent to the archive team');return}
  if(t.dataset.color){arGlobal(t.dataset.color);return}
  if(t.dataset.kw){arGlobal(t.dataset.kw);return}
  if(t.dataset.user!==undefined){const u=USERS[+t.dataset.user];closeCase();clearFocus();openUser(u);return}
  if(t.dataset.board!==undefined){let b;
    if(t.dataset.board==='new'){b={n:'Untitled board '+(MYB.length-2)};MYB.push(b)}else b=MYB[+t.dataset.board];
    if(b.mood){if(!state.saved.includes(it.idx))state.saved.push(it.idx);const sb=document.querySelector('#arTop [data-ar=save]');if(sb){sb.classList.add('on');sb.textContent='Saved ✓'}}
    else{(BOARDS_OF[b.n]=BOARDS_OF[b.n]||[]);if(!BOARDS_OF[b.n].includes(it.idx))BOARDS_OF[b.n].push(it.idx)}
    toast(`Added to ${b.n}`);arRight(it);return}
}
$('#arRt').addEventListener('click',arRtAct);$('#arShade').addEventListener('click',()=>{document.body.classList.remove('side-on','ppl-on');const b=$('#arRt [data-rt=info]');if(b)b.setAttribute('aria-expanded','false')});$('#arSide').addEventListener('click',arRtAct);
$('#arSide').addEventListener('input',ev=>{if(ev.target.matches('.sd-pop input')){const v=norm(ev.target.value);$('#arSide').querySelectorAll('.sd-pop [data-board]').forEach(r=>r.style.display=norm(r.textContent).includes(v)?'':'none')}});
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('#arRt')){const m=$('#arMenu');if(m)m.classList.remove('on')}if(!ev.target.closest('#sdDd')){const d=$('#sdDd');if(d)d.classList.remove('open')}});


const VER='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l2.6 2 3.2-.4.9 3.1 2.8 1.6-1 3.1 1 3.1-2.8 1.6-.9 3.1-3.2-.4-2.6 2-2.6-2-3.2.4-.9-3.1-2.8-1.6 1-3.1-1-3.1 2.8-1.6.9-3.1 3.2.4z"/><path d="M8 12.2l2.6 2.6L16.2 9" fill="none" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function renderPpl(it){
  const S=savers(it);
  $('#arPpl').innerHTML=`<div class="pp-h"><b>Saved by ${S.total}</b><span>members · ${S.all.filter(p=>p.tier!=='Free').length} verified</span></div>
   <div class="pp-l">${S.all.map((p,i)=>`<div class="pp-r"><span class="pp-av" style="background:${p.c}">${esc(p.ini)}</span>
     <div class="pp-t"><div class="pp-n">${p.u?`<button data-user="${USERS.indexOf(p.u)}">${esc(p.n)}</button>`:esc(p.n)}${p.tier!=='Free'?VER.replace('<svg',`<svg class="${p.tier==='Golden'?'gold':''}"`).replace('aria-hidden="true"',`aria-label="${p.tier} member"`):''}</div>
       <div class="pp-ro">${esc(p.ro)}${i===0?` · <i>✓ 1st saved</i>`:''}</div></div>
     <button class="pp-f" data-follow="${esc(p.n)}" aria-pressed="${FOLLOW.has(p.n)}">${FOLLOW.has(p.n)?'Following':'Follow'}</button></div>`).join('')}</div>`;
}
$('#arPpl').addEventListener('click',ev=>{
  const f=ev.target.closest('[data-follow]');if(f){const n=f.dataset.follow;FOLLOW.has(n)?FOLLOW.delete(n):FOLLOW.add(n);const on=FOLLOW.has(n);f.setAttribute('aria-pressed',on);f.textContent=on?'Following':'Follow';if(on)toast(`Following ${n}`);return}
  const u=ev.target.closest('[data-user]');if(u){document.body.classList.remove('ppl-on');closeCase();clearFocus();openUser(USERS[+u.dataset.user])}});


/* ================= LINEAR (collection carousel) =================
   A collection from COLLECTIONS opens as one horizontal line of cards, centred vertically (Kunumi "Linear"):
   a title card, then the cases as square image cards (title, award + year tags, client). Wheel / trackpad /
   drag move it sideways with inertia; cards near the centre sit at full size, the rest ease down a little. */
const lin=$('#lin'),lnTrack=$('#lnTrack');
let ln={on:false,x:0,tx:0,max:0,v:0,drag:null,raf:0,hov:null,vid:null};
function linOpen(cl){
  const L=ordered(cl.items,state.arrange==='standard'?'award':state.arrange);
  lnTrack.innerHTML=`<div class="ln-c ln-txt" data-head><div class="s">${esc(cl.sub||'')}</div><h3 class="ln-t">${esc(cl.t)}</h3><div class="ln-f"><div class="ln-tags"><span>${cl.trend?'Trending search':'Collection'}</span></div><span class="ln-m">${cl.items.length} cases</span></div></div>`+
    L.map(it=>`<div class="ln-c ln-img" style="--w:${Math.round(Math.max(150,Math.min(480,260*it.ratio)))}px" data-i="${it.idx}" tabindex="0" role="button" aria-label="${esc(it.t)}"><img src="${it.gridSrc||it.thumb}" alt="" loading="lazy" onerror="this.remove()">
      <div class="ln-in"><h3 class="ln-t">${esc(it.t)}</h3><div class="ln-f"><div class="ln-tags"><span>${esc(AW[it.aw].l)}</span><span>${it.y}</span></div><span class="ln-m">${esc(it.c)}</span></div></div></div>`).join('');
  document.body.classList.add('lin-on');ln.on=true;
  requestAnimationFrame(()=>{const cs=[...lnTrack.children];const W0=cs[0].offsetWidth;
    ln.x=ln.tx=W0/2;linApply(true);
    cs.forEach((c,i)=>setTimeout(()=>c.classList.add('in'),120+Math.min(i,10)*60));linDim()});
  if(!ln.raf)ln.raf=requestAnimationFrame(linTick);
}
function linClose(){if(!ln.on)return;ln.on=false;document.body.classList.remove('lin-on');linStopVid();setTimeout(()=>{if(!ln.on)lnTrack.innerHTML=''},500)}
function linDim(){if(!ln.on)return;lnTrack.querySelectorAll('[data-i]').forEach(c=>c.classList.toggle('dim',!passes(ITEMS[+c.dataset.i])))}
function linApply(force){
  const lo=lnTrack.firstElementChild?lnTrack.firstElementChild.offsetWidth/2:0, hi=lnTrack.scrollWidth-innerWidth- (lnTrack.lastElementChild?lnTrack.lastElementChild.offsetWidth/2:0);
  ln.lo=lo;ln.hi=Math.max(lo,hi);
  lnTrack.style.transform=`translate3d(${-ln.x}px,0,0)`;
  const cx=innerWidth/2;
  for(const c of lnTrack.children){const r=c.offsetLeft-ln.x+c.offsetWidth/2;const d=Math.min(1,Math.abs(r-cx)/(innerWidth*.6));c.style.transform=''}
  const p=$('#lnProg');if(p){const k=(ln.x-ln.lo)/Math.max(1,ln.hi-ln.lo);p.style.width='20%';p.style.transform=`translateX(${Math.max(0,Math.min(1,k))*400}%)`}
}
function linTick(){ln.raf=requestAnimationFrame(linTick);if(!ln.on)return;
  if(!ln.drag){ln.tx+=ln.v;ln.v*=.92;}
  ln.tx=Math.max(ln.lo??0,Math.min(ln.hi??0,ln.tx));
  ln.x+=(ln.tx-ln.x)*.12;linApply()}
lin.addEventListener('wheel',ev=>{if(!ln.on)return;ev.preventDefault();ln.tx+=(Math.abs(ev.deltaX)>Math.abs(ev.deltaY)?ev.deltaX:ev.deltaY)*1.1},{passive:false});
lin.addEventListener('pointerdown',ev=>{if(ev.button!==0)return;ln.drag={x:ev.clientX,tx:ln.tx,moved:0,t:performance.now(),lx:ev.clientX};lin.classList.add('drag')});
addEventListener('pointermove',ev=>{if(!ln.drag)return;const dx=ev.clientX-ln.drag.x;ln.drag.moved=Math.max(ln.drag.moved,Math.abs(dx));ln.tx=ln.drag.tx-dx;ln.v=-(ev.clientX-ln.drag.lx)*.9;ln.drag.lx=ev.clientX});
addEventListener('pointerup',ev=>{if(!ln.drag)return;const d=ln.drag;ln.drag=null;lin.classList.remove('drag');
  if(d.moved<6){const c=ev.target.closest&&ev.target.closest('[data-i]');if(c&&!c.classList.contains('dim'))openCase(ITEMS[+c.dataset.i],'spatial');else if(!c&&!ev.target.closest('.ln-c'))closeCollection()}});
addEventListener('keydown',ev=>{if(!ln.on||arCtx||cxCtx||document.activeElement===qi)return;
  if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){ev.preventDefault();ln.tx+=(ev.key==='ArrowRight'?300:-300)}
  if(ev.key==='Enter'){const c=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('[data-i]');if(c)openCase(ITEMS[+c.dataset.i],'spatial')}});
// 15 s preview on hover
function linStopVid(){if(ln.vid){killVideo(ln.vid);ln.vid=null}clearTimeout(ln.hov)}
lnTrack.addEventListener('pointerover',ev=>{const c=ev.target.closest('[data-i]');if(!c||c._v)return;linStopVid();const it=ITEMS[+c.dataset.i];if(!PV(it))return;
  ln.hov=setTimeout(()=>{ln.vid=makeVideo(PV(it));c.prepend(ln.vid);c._v=true},350)});
lnTrack.addEventListener('pointerout',ev=>{const c=ev.target.closest('[data-i]');if(!c||c.contains(ev.relatedTarget))return;c._v=false;linStopVid()});


/* ---------- collection actions + scoped search ---------- */
var colMode='linear',scopeOn=true,scopeCl=null;const FOLC=new Set();
const IC_GRID='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const IC_LINE='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="6" height="10" rx="1.5"/><rect x="9.5" y="5" width="6" height="14" rx="1.5"/><rect x="17" y="7" width="5" height="10" rx="1.5"/></svg>';
function colActs(cl){
  if(state.view!=='spatial')return;
  const c=$('#crumb');const on=FOLC.has(cl.t);const lin=colMode==='linear'&&isLinearCol(cl);
  const box=document.createElement('span');box.className='cact';
  box.innerHTML=`<button class="fol" data-ca="follow" aria-pressed="${on}">${on?'Following':'Follow'}</button>
    <button class="ic" data-ca="more" aria-label="Share options" aria-haspopup="true">${IC.dots}</button>
    <button class="mode" data-ca="mode" title="${lin?'See the whole collection on the canvas':'Back to the linear view'}">${lin?IC_GRID+'Canvas':IC_LINE+'Linear'}</button>
    <div class="cmenu" id="cmenu" role="menu"><button data-ca="copy">${IC.share}Share collection</button><button data-ca="link">${IC.find}Copy link</button><button data-ca="embed">${IC.dl}Export as PDF</button></div>`;
  c.appendChild(box);
}
$('#crumb').addEventListener('click',ev=>{const b=ev.target.closest('[data-ca]');if(!b)return;const cl=state.collection;if(!cl)return;const m=$('#cmenu');
  if(b.dataset.ca==='more'){m.classList.toggle('on');return}
  if(m)m.classList.remove('on');
  if(b.dataset.ca==='follow'){FOLC.has(cl.t)?FOLC.delete(cl.t):FOLC.add(cl.t);const on=FOLC.has(cl.t);b.setAttribute('aria-pressed',on);b.textContent=on?'Following':'Follow';toast(on?`Following ${cl.t}`:`Unfollowed ${cl.t}`);return}
  if(b.dataset.ca==='copy'||b.dataset.ca==='link'){try{navigator.clipboard.writeText(location.href.split('#')[0]+'#c='+encodeURIComponent(cl.t))}catch(e){}toast('Collection link copied');return}
  if(b.dataset.ca==='embed'){toast('PDF export · Premium & Golden members');return}
  if(b.dataset.ca==='mode'){colMode=colMode==='linear'?'canvas':'linear';const keep=cl;linClose();state.collection=null;openCollection(keep)}});
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.cact')){const m=$('#cmenu');if(m)m.classList.remove('on')}});
function scopeSync(){const cl=state.collection,on=!!(cl&&scopeOn&&state.view==='spatial');
  $('#scope').classList.toggle('on',on);$('#sform').classList.toggle('scoped',on);
  if(on){$('#scopeT').textContent=cl.t;const im=$('#scopeImg');if(im&&cl.items[0])im.src=cl.items[0].thumb}
  if(document.activeElement!==qi&&!document.body.classList.contains('intro'))qi.placeholder='Ask anything…'}
$('#scopeX').onclick=ev=>{ev.preventDefault();ev.stopPropagation();scopeOn=false;scopeSync();qi.focus()};
function scopedSearch(q){
  closeSugg();qi.blur();if(q){state.history=state.history.filter(x=>x!==q);state.history.push(q)}
  state.query=q;qi.value=q;
  if(ln.on){linDim()}else relayout();
  ui();const cl=state.collection;const n=cl.items.filter(passes).length;
  toast(q?`${n} of ${cl.items.length} in ${cl.t} for “${q}”`:`All of ${cl.t}`);
  if(ln.on&&q){const first=lnTrack.querySelector('[data-i]:not(.dim)');if(first)ln.tx=first.offsetLeft+first.offsetWidth/2-innerWidth/2}
}


/* ---------- home · trending searches (two drifting rows, ref. cosmos.so/explore) ---------- */
(()=>{
  const C=['Craft in film','Creative use of AI','Out of home','Social media','Health & wellness','Music & sound','Typography','Gaming','Sustainable development',
    'Experiential','Public relations','Branded entertainment','Packaging','Pharma','Print & promotional','Direct marketing','Creative use of data','Interactive',
    'Photography','Illustration','Spotify','Heinz','AXA','Coca-Cola','Paris','Tokyo','New York','Mexico','São Paulo','London','The Indies','Cultural driver','Radio','Motion'];
  const Q=C.map(q=>{const M=ITEMS.filter(i=>matches(i,q)).sort((a,b)=>a.rank-b.rank);return M.length>=2?{q,it:M[0],n:M.length}:null}).filter(Boolean);
  const pill=x=>`<button class="tsr-p" data-q="${esc(x.q)}" title="${x.n} cases"><img src="${x.it.thumb}" alt="" loading="lazy" onerror="this.outerHTML='<i class=ph></i>'">‘${esc(x.q)}’</button>`;
  const half=Math.ceil(Q.length/2),A=Q.slice(0,half),B=Q.slice(half);
  $('#tsr1').innerHTML=[...A,...A].map(pill).join('');$('#tsr2').innerHTML=[...B,...B].map(pill).join('');
  $('#tsr').addEventListener('click',ev=>{const b=ev.target.closest('[data-q]');if(!b)return;openTrend(b.dataset.q)});
})();


/* trending searches are shortcuts: each opens a curated, linear "trend" set (not listed in COLLECTIONS) */
function openTrend(q){
  const items=ITEMS.filter(i=>matches(i,q)).sort((a,b)=>a.rank-b.rank||b.pencils-a.pencils);if(!items.length){runSearch(q);return}
  activate();if(state.view!=='spatial')setView('spatial');
  if(state.tab!=='explore'){state.tab='explore';document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab==='explore'))}
  trOpen=false;trSync();
  openCollection({t:q,sub:'Trending search · curated',items,from:'Trending searches',trend:true});
  toast(`${items.length} cases · ${q}`);
}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.onclick=()=>{activate();setTab(b.dataset.tab)});
setTab('explore');requestAnimationFrame(frame);
window.__toc={state,ITEMS,cam,live,get focus(){return focus},setFocus,runSearch,activate,setView,tl,tlOpenCat,tlSolo};
})();
</script>
